<!DOCTYPE html>
<!-- 
  =============================================================================
  UNIFEED (유니피드) 마이페이지 화면
  =============================================================================
  사용자의 프로필, 작성 글/리뷰/스크랩 통계, 프로필 편집 링크 및 
  내가 올린 맛집 사진 그리드를 확인할 수 있는 개인 페이지입니다.
  모든 스타일은 app.css에 정의된 클래스를 사용하며 인라인 style 속성을 일절 사용하지 않습니다.
  =============================================================================
-->
<html xmlns:th="http://www.thymeleaf.org">

<!-- 공통 <head> 조각을 불러오며 브라우저 탭 제목으로 '마이'를 전달합니다. -->
<head th:replace="~{fragments/layout :: head('마이')}"></head>

<body>
    <!-- 상단 공통 헤더 조각을 불러옵니다. -->
    <header th:replace="~{fragments/layout :: header('mypage')}"></header>

    <!-- 메인 컨텐츠 컨테이너: 탭바에 가려지지 않도록 pb-safe 클래스를 함께 부여합니다. -->
    <main class="page-container pb-safe">
        <div class="mypage-desktop-layout">
            
            <!-- 왼쪽 사이드바 (데스크톱) / 상단 (모바일) -->
            <div class="mypage-sidebar">
                <!-- 1. 프로필 정보 카드 영역 -->
                <div class="profile-card">
                    <!-- 대형 프로필 원형 아바타 -->
                    <div class="avatar-lg"></div>
                    
                    <!-- 사용자 이름 -->
                    <h2 class="profile-name">김준호</h2>
                    
                    <!-- 학교명 및 미식가 레벨 배지 -->
                    <div class="profile-info">
                        <span class="profile-school">오산대학교</span>
                        <span class="badge">돈까스킬러</span>
                    </div>
                    
                    <!-- 작성 통계 영역 (게시글 수, 팔로워, 팔로잉) -->
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-value">12</div>
                            <div class="stat-label">게시글</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">48</div>
                            <div class="stat-label">팔로워</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">32</div>
                            <div class="stat-label">팔로잉</div>
                        </div>
                    </div>
                    
                    <!-- 프로필 및 계정 설정을 변경할 수 있는 설정 페이지 링크 버튼 -->
                    <a th:href="@{/settings}" class="profile-edit-btn">
                        프로필 편집
                    </a>
                </div>
            </div>

            <!-- 오른쪽 컨텐츠 (데스크톱) / 하단 (모바일) -->
            <div class="mypage-content">
                <!-- 2. 게시글/리뷰 탭 스위처 영역 -->
                <div class="tab-switcher">
                    <!-- 활성화(active)된 탭은 진한 글씨와 하단 강조선이 적용됩니다. -->
                    <div class="tab-switcher-item active">내 게시글</div>
                    <div class="tab-switcher-item">내 리뷰</div>
                    <div class="tab-switcher-item">저장한 글</div>
                </div>
                
                <!-- 3. 업로드한 사진 썸네일 그리드 (3열 인스타그램 스타일) -->
                <!-- 나중에 사용자가 올린 실제 사진 리스트로 Thymeleaf 반복 렌더링될 영역입니다. -->
                <div class="thumbnail-grid">
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- 하단 탭 바 조각을 불러옵니다. 'mypage' 탭이 활성화(active)되도록 설정합니다. -->
    <nav th:replace="~{fragments/layout :: tabbar('mypage')}"></nav>
</body>
</html>

<!DOCTYPE html>
<!-- 
  =============================================================================
  UNIFEED (유니피드) 맛집 지도 화면
  =============================================================================
  카카오맵 지도 API를 기반으로 내 주변의 음식점, 카페 위치를 지도 위에 핀으로 표시하고,
  상단 검색 및 음식 카테고리 필터링(한식, 일식, 양식 등) 기능을 제공합니다.
  모든 스타일은 app.css에 정의된 클래스를 사용하며 임의의 Tailwind 클래스나 인라인 style을 사용하지 않습니다.
  =============================================================================
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 공통 <head> 조각을 불러오며 브라우저 탭 제목으로 '지도'를 전달합니다. -->
<head th:replace="~{fragments/layout :: head('지도')}"></head>

<!-- page-full: 데스크톱 및 모바일에서 화면 전체 너비와 높이를 꽉 채워 지도를 보여줍니다. -->
<body class="page-full">
    
    <!-- 공통 상단 헤더 조각을 불러옵니다. -->
    <header th:replace="~{fragments/layout :: header('map')}"></header>

    <!-- 지도 전체 화면 레이아웃 컨테이너 -->
    <div class="map-container map-desktop-layout">
        
        <!-- 왼쪽 사이드바 (데스크톱에서는 사이드바, 모바일에서는 상단에 오버레이) -->
        <div class="map-sidebar">
            <!-- 1. 상단 고정 바: 검색바 및 카테고리 칩 필터 -->
            <div class="map-top-bar">
                
                <!-- 검색창 영역 -->
                <div class="map-search-wrapper">
                    <div class="map-search-bar">
                        <!-- 검색 돋보기 아이콘 -->
                        <span class="map-search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <!-- 검색어 입력 필드 -->
                        <input type="text" placeholder="내 주변 맛집 검색..." class="map-search-input">
                    </div>
                </div>

                <!-- 카테고리 칩 필터 목록 (가로 스크롤 가능) -->
                <div class="chip-group">
                    <button type="button" class="chip active">전체</button>
                    <button type="button" class="chip">🍚 한식</button>
                    <button type="button" class="chip">🍣 일식</button>
                    <button type="button" class="chip">🍝 양식</button>
                    <button type="button" class="chip">☕ 카페</button>
                    <button type="button" class="chip">🍜 중식</button>
                    <button type="button" class="chip">🍢 분식</button>
                </div>
            </div>
            
            <!-- 데스크톱용 맛집 리스트 (모바일에서는 CSS로 숨길 수 있지만 현재는 데스크톱에서만 잘 보이도록 구성) -->
            <div class="desktop-only" style="padding: 16px; flex-direction: column; gap: 12px; display: flex; width: 100%;">
                <div class="card" style="margin-bottom: 0;">
                    <h3 style="margin-bottom:4px;">오산대 학생식당</h3>
                    <p style="font-size:0.875rem; color:var(--text-secondary);">경기도 오산시 청학로 45</p>
                </div>
                <div class="card" style="margin-bottom: 0;">
                    <h3 style="margin-bottom:4px;">궐동 맛있는 떡볶이</h3>
                    <p style="font-size:0.875rem; color:var(--text-secondary);">경기도 오산시 궐동</p>
                </div>
            </div>
        </div>

        <!-- 2. 실제 카카오 지도가 그려지는 메인 캔버스 영역 -->
        <main class="map-canvas map-canvas-area">
            <!-- 카카오 지도가 렌더링될 실제 컨테이너 (width/height: 100%) -->
            <div id="map" style="width: 100%; height: 100%;"></div>

            <!-- 3. 지도 플로팅 컨트롤 (현재 위치 GPS 버튼 & 줌 인/아웃 버튼) -->
            <div class="map-floating-controls">
                <!-- 현재 내 위치로 이동하는 버튼 -->
                <button type="button" id="btnMyLocation" class="map-ctrl-btn" aria-label="내 위치" title="내 위치로 이동">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                
                <!-- 지도 확대/축소 버튼 그룹 -->
                <div class="map-zoom-group">
                    <button type="button" id="btnZoomIn" class="map-zoom-btn" aria-label="확대" title="확대">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <button type="button" id="btnZoomOut" class="map-zoom-btn" aria-label="축소" title="축소">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 하단 탭 바 조각을 불러옵니다. 'map' 탭이 활성화(active)되도록 설정합니다. -->
    <nav th:replace="~{fragments/layout :: tabbar('map')}"></nav>

    <!-- 카카오 지도 생성 및 마커 표시 스크립트 -->
    <script>
        function renderMap() {
            var mapContainer = document.getElementById('map');
            if (!mapContainer) {
                console.error('지도 엘리먼트(#map)를 찾을 수 없습니다.');
                return;
            }
            
            // 기본 중심 좌표: 오산대학교 인근 (위도: 37.15585, 경도: 127.06352)
            var osanUnivPos = new kakao.maps.LatLng(37.155850, 127.063520);
            
            var mapOption = {
                center: osanUnivPos,
                level: 4
            };

            // 1. 지도 생성
            var map = new kakao.maps.Map(mapContainer, mapOption);
            console.log('UNIFEED Kakao Map Successfully Initialized!');

                // 2. 대학가 주변 맛집 예시 데이터 (향후 백엔드 DB 연동 데이터)
                var restaurants = [
                    {
                        name: '오산대 학생식당',
                        category: '한식',
                        rating: 4.5,
                        lat: 37.156100,
                        lng: 127.063300,
                        desc: '가성비 최고 오늘의 학식'
                    },
                    {
                        name: '궐동 맛있는 떡볶이',
                        category: '분식',
                        rating: 4.8,
                        lat: 37.157800,
                        lng: 127.060500,
                        desc: '치즈 듬뿍 매콤 떡볶이와 튀김'
                    },
                    {
                        name: '오산 스시하우스',
                        category: '일식',
                        rating: 4.7,
                        lat: 37.154200,
                        lng: 127.065100,
                        desc: '신선한 초밥과 얼큰한 나가사키 짬뽕'
                    },
                    {
                        name: '카페 블룸 (오산대점)',
                        category: '카페',
                        rating: 4.9,
                        lat: 37.156900,
                        lng: 127.064200,
                        desc: '공부하기 좋은 조용한 분위기'
                    }
                ];

                // 3. 지도에 맛집 마커 및 말풍선(인포윈도우) 표시
                var currentInfowindow = null;

                restaurants.forEach(function (place) {
                    var markerPosition = new kakao.maps.LatLng(place.lat, place.lng);

                    // 마커 생성
                    var marker = new kakao.maps.Marker({
                        position: markerPosition,
                        map: map
                    });

                    // 마커 클릭 시 뜰 말풍선 내용 HTML
                    var content = '<div style="padding:10px 14px; min-width:180px; font-family: Pretendard, sans-serif;">' +
                        '<div style="font-weight:700; font-size:14px; color:#111827; margin-bottom:2px;">' + place.name + '</div>' +
                        '<div style="font-size:12px; color:#F97316; font-weight:600; margin-bottom:4px;">★ ' + place.rating + ' (' + place.category + ')</div>' +
                        '<div style="font-size:11px; color:#6B7280;">' + place.desc + '</div>' +
                        '</div>';

                    var infowindow = new kakao.maps.InfoWindow({
                        content: content,
                        removable: true
                    });

                    // 마커 클릭 이벤트 등록: 클릭 시 말풍선 열기
                    kakao.maps.event.addListener(marker, 'click', function () {
                        if (currentInfowindow) {
                            currentInfowindow.close();
                        }
                        infowindow.open(map, marker);
                        currentInfowindow = infowindow;
                    });
                });

                // 4. 지도 줌 인/아웃 버튼 이벤트 연결
                var btnZoomIn = document.getElementById('btnZoomIn');
                var btnZoomOut = document.getElementById('btnZoomOut');

                if (btnZoomIn) {
                    btnZoomIn.addEventListener('click', function () {
                        map.setLevel(map.getLevel() - 1);
                    });
                }

                if (btnZoomOut) {
                    btnZoomOut.addEventListener('click', function () {
                        map.setLevel(map.getLevel() + 1);
                    });
                }

                // 5. 내 위치(GPS) 버튼 이벤트 연결
                var btnMyLocation = document.getElementById('btnMyLocation');
                if (btnMyLocation) {
                    btnMyLocation.addEventListener('click', function () {
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(function (position) {
                                var lat = position.coords.latitude;
                                var lon = position.coords.longitude;
                                var locPosition = new kakao.maps.LatLng(lat, lon);
                                
                                map.panTo(locPosition); // 내 위치로 부드럽게 화면 이동
                            }, function (error) {
                                alert('내 위치 정보를 가져올 수 없습니다: ' + error.message);
                            });
                        } else {
                            alert('현재 브라우저에서 위치 정보(Geolocation)를 지원하지 않습니다.');
                        }
                    });
                }
        }

        // 카카오 지도 SDK 준비 완료 시 지도 렌더링
        function initMap() {
            if (typeof kakao !== 'undefined' && kakao.maps) {
                kakao.maps.load(renderMap);
            } else {
                setTimeout(initMap, 100);
            }
        }

        window.addEventListener('load', initMap);
    </script>
</body>
</html>

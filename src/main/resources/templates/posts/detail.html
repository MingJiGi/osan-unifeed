<!DOCTYPE html>
<!--
  게시글 상세 화면 (posts/detail.html)
  ----------------------------------------------------------------------------
  - ${post} 한 건을 보여준다 (PostController.detail() 에서 model 에 담아줌)
  - post.imgUrl 이 있으면 음식 사진 표시, 없으면 생략
  - post.tags 가 있으면 해시태그 표시
  - 수정/삭제 버튼 포함 (삭제는 POST 폼으로 - GET 링크로 하면 크롤러가 실수로 삭제할 수 있음)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head(${post.title})}"></head>

<body class="detail-body">

<!-- GNB 헤더 -->
<header class="gnb">
  <div class="gnb-left">
    <a th:href="@{/}" class="gnb-logo">
      <img th:src="@{/images/logo.png}" alt="유니피드" class="gnb-logo-img"
           onerror="this.style.display='none'">
      <span class="gnb-logo-text">유니피드</span>
    </a>
    <nav class="gnb-nav">
      <a th:href="@{/map}"       class="gnb-nav-link">🗺️ 지도</a>
      <a th:href="@{/posts}"     class="gnb-nav-link active">💬 커뮤니티</a>
      <a th:href="@{/timetable}" class="gnb-nav-link">📅 시간표</a>
      <a th:href="@{/mypage}"    class="gnb-nav-link">👤 마이페이지</a>
    </nav>
  </div>
  <div class="gnb-right">
    <div class="gnb-search">
      <input type="text" placeholder="내 주변 맛집 검색" class="gnb-search-input">
      <span class="gnb-search-icon">🔍</span>
    </div>
    <img th:src="@{/images/avatar.jpg}" alt="프로필" class="gnb-avatar"
         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2238%22><circle cx=%2219%22 cy=%2219%22 r=%2219%22 fill=%22%23FED7AA%22/></svg>'">
  </div>
</header>

<!-- 메인 컨텐츠 -->
<main class="detail-container">

  <!-- 목록으로 돌아가기 -->
  <a th:href="@{/posts}" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    목록으로
  </a>

  <!-- 상세 카드 -->
  <article class="detail-card">

    <!-- 작성자 정보 -->
    <div class="detail-author">
      <img th:if="${post.author.profileImage != null}"
           th:src="${post.author.profileImage}" alt="프로필" class="author-avatar">
      <div th:unless="${post.author.profileImage != null}" class="author-avatar-default">👤</div>
      <div class="author-info">
        <span class="author-name" th:text="${post.author.name}">작성자</span>
        <span class="author-meta">
          오산대학교 ·
          <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">2026.01.01</span>
        </span>
      </div>
      <!-- 수정/삭제 버튼 -->
      <div class="detail-actions">
        <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="action-btn edit-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>
          </svg>
          수정
        </a>
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="margin:0"
              onsubmit="return confirm('정말 삭제할까요?');">
          <button type="submit" class="action-btn delete-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4h6v2"/>
            </svg>
            삭제
          </button>
        </form>
      </div>
    </div>

    <!-- 제목 -->
    <h1 class="detail-title" th:text="${post.title}">게시글 제목</h1>

    <!-- 음식 사진 (imgUrl 있을 때만 표시) -->
    <div class="detail-img-wrap" th:if="${post.imgUrl != null}">
      <img th:src="${post.imgUrl}" alt="음식 사진" class="detail-img">
    </div>

    <!-- 본문 -->
    <div class="detail-content" th:text="${post.content}">본문 내용</div>

    <!-- 해시태그 (있을 때만 표시) -->
    <div class="detail-tags" th:if="${post.tags != null}">
      <span class="tag-item"
            th:each="tag : ${#strings.arraySplit(post.tags, ',')}"
            th:text="'#' + ${#strings.trim(tag)}">
        #태그
      </span>
    </div>

    <!-- 구분선 -->
    <div class="detail-divider"></div>

    <!-- 좋아요 / 댓글 수 -->
    <div class="detail-reactions">
      <button class="reaction-btn like-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        좋아요 <span th:text="${post.likeCount}">0</span>
      </button>
      <span class="reaction-count">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        댓글 <span th:text="${post.commentCount}">0</span>
      </span>
      <button class="reaction-btn save-btn" style="margin-left:auto">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        저장
      </button>
    </div>

  </article>

  <!-- 댓글 영역 (추후 구현 예정) -->
  <div class="comment-section">
    <h3 class="comment-title">댓글 <span th:text="${post.commentCount}">0</span></h3>
    <div class="comment-empty">
      <span>💬</span>
      <p>아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>
    </div>
    <!-- 댓글 입력창 (추후 구현 예정) -->
    <div class="comment-input-wrap">
      <div class="comment-avatar-default">👤</div>
      <input type="text" class="comment-input" placeholder="댓글을 입력하세요... (준비 중)">
      <button class="comment-submit" disabled>등록</button>
    </div>
  </div>

</main>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body.detail-body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  background: #F9FAFB; max-width: none; padding: 0; min-height: 100vh;
}
/* GNB */
.gnb {
  height: 64px; background: #fff; border-bottom: 1px solid #E5E7EB;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; position: sticky; top: 0; z-index: 100;
}
.gnb-left { display: flex; align-items: center; gap: 36px; }
.gnb-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.gnb-logo-img { height: 42px; width: auto; object-fit: contain; }
.gnb-logo-text { font-size: 20px; font-weight: 900; color: #F97316; letter-spacing: -0.5px; }
.gnb-nav { display: flex; gap: 4px; }
.gnb-nav-link {
  text-decoration: none; color: #64748B; font-size: 15px; font-weight: 600;
  padding: 0 14px; height: 64px; display: flex; align-items: center;
  position: relative; transition: color 0.2s;
}
.gnb-nav-link:hover { color: #F97316; text-decoration: none; }
.gnb-nav-link.active { color: #F97316; }
.gnb-nav-link.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: #F97316; border-radius: 2px 2px 0 0;
}
.gnb-right { display: flex; align-items: center; gap: 14px; }
.gnb-search { position: relative; display: flex; align-items: center; }
.gnb-search-input {
  width: 200px; height: 36px; border: 1px solid #E5E7EB; border-radius: 9999px;
  padding: 0 34px 0 14px; font-size: 13px; background: #F8FAFC; outline: none;
}
.gnb-search-input:focus { border-color: #F97316; }
.gnb-search-icon { position: absolute; right: 12px; color: #94A3B8; }
.gnb-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #FED7AA; }

/* 메인 컨테이너 */
.detail-container {
  max-width: 720px; margin: 0 auto; padding: 28px 24px 80px;
}

/* 목록으로 버튼 */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: #64748B; text-decoration: none; font-size: 14px; font-weight: 600;
  margin-bottom: 20px; transition: color 0.2s;
}
.back-btn:hover { color: #F97316; text-decoration: none; }

/* 상세 카드 */
.detail-card {
  background: #fff; border: 1px solid #E5E7EB; border-radius: 16px;
  padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  margin-bottom: 16px;
}

/* 작성자 */
.detail-author {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.author-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #FED7AA; }
.author-avatar-default {
  width: 44px; height: 44px; border-radius: 50%; background: #FFF7ED;
  border: 2px solid #FED7AA; display: flex; align-items: center; justify-content: center; font-size: 20px;
  flex-shrink: 0;
}
.author-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.author-name { font-size: 15px; font-weight: 700; color: #1E293B; }
.author-meta { font-size: 12px; color: #94A3B8; }

/* 수정/삭제 버튼 */
.detail-actions { display: flex; gap: 8px; margin-left: auto; }
.action-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; text-decoration: none; transition: all 0.2s;
}
.edit-btn { background: #F1F5F9; color: #475569; }
.edit-btn:hover { background: #E2E8F0; color: #1E293B; text-decoration: none; }
.delete-btn { background: #FEF2F2; color: #EF4444; }
.delete-btn:hover { background: #FEE2E2; }

/* 제목 */
.detail-title {
  font-size: 22px; font-weight: 800; color: #0F172A;
  line-height: 1.4; margin-bottom: 20px;
}

/* 음식 사진 */
.detail-img-wrap {
  width: 100%; border-radius: 12px; overflow: hidden;
  margin-bottom: 20px; background: #F1F5F9; max-height: 420px;
}
.detail-img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 본문 */
.detail-content {
  font-size: 15px; color: #334155; line-height: 1.8;
  white-space: pre-wrap; margin-bottom: 20px;
}

/* 해시태그 */
.detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.tag-item {
  background: #FFF7ED; color: #F97316; font-size: 13px; font-weight: 600;
  padding: 4px 12px; border-radius: 9999px; border: 1px solid #FED7AA;
}

/* 구분선 */
.detail-divider { height: 1px; background: #F1F5F9; margin-bottom: 16px; }

/* 반응 버튼 */
.detail-reactions { display: flex; align-items: center; gap: 16px; }
.reaction-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none; cursor: pointer;
  font-size: 14px; font-weight: 600; color: #64748B;
  padding: 6px 10px; border-radius: 8px; transition: all 0.2s;
}
.reaction-btn:hover { background: #F8FAFC; color: #F97316; }
.reaction-count {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: #94A3B8;
}

/* 댓글 영역 */
.comment-section {
  background: #fff; border: 1px solid #E5E7EB; border-radius: 16px;
  padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.comment-title { font-size: 16px; font-weight: 800; color: #1E293B; margin-bottom: 20px; }
.comment-empty {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 32px 0; color: #94A3B8; font-size: 14px;
}
.comment-empty span { font-size: 28px; }
.comment-input-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-top: 20px; padding-top: 16px; border-top: 1px solid #F1F5F9;
}
.comment-avatar-default {
  width: 36px; height: 36px; border-radius: 50%; background: #FFF7ED;
  border: 2px solid #FED7AA; display: flex; align-items: center;
  justify-content: center; font-size: 16px; flex-shrink: 0;
}
.comment-input {
  flex: 1; height: 40px; border: 1.5px solid #E5E7EB; border-radius: 9999px;
  padding: 0 16px; font-size: 14px; outline: none; font-family: inherit;
  background: #F8FAFC; color: #94A3B8;
}
.comment-submit {
  height: 40px; padding: 0 18px; background: #F97316; color: #fff;
  border: none; border-radius: 9999px; font-size: 13px; font-weight: 700;
  cursor: not-allowed; opacity: 0.5;
}
</style>

</body>
</html>

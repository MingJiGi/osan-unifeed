<!DOCTYPE html>
<!--
  게시글 상세 화면 (posts/detail.html)
  ----------------------------------------------------------------------------
  - ${post} 한 건을 보여준다 (PostController.detail() 에서 model 에 담아줌)
  - post.imgUrl 이 있으면 음식 사진 표시, 없으면 생략
  - post.tags 가 있으면 해시태그 표시
  - 수정/삭제 버튼 포함 (삭제는 POST 폼으로 전송)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head(${post.title})}"></th:block>
  <link rel="stylesheet" th:href="@{/css/detail.css(v='9')}">
</head>

<body class="detail-body">

<!-- 공통 GNB 헤더 -->
<header th:replace="~{fragments/layout :: gnb('posts')}"></header>

<!-- 메인 컨텐츠 -->
<main class="detail-container">

  <!-- 목록으로 돌아가기 -->
  <a th:href="@{/posts}" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    목록으로
  </a>

  <!-- 상세 카드 -->
  <article class="detail-card">

    <!-- 작성자 정보 — 익명 처리: 실제 프로필 사진/이름은 절대 노출하지 않는다 -->
    <div class="detail-author">
      <div class="author-avatar-default"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div class="author-info">
        <span class="author-name" th:text="${anonLabels.get(post.author.id)}">익명1</span>
        <span class="author-meta">
          <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">2026.01.01</span>
        </span>
      </div>
      <!-- 수정/삭제 버튼 (작성자 본인에게만 표시) -->
      <div class="detail-actions" th:if="${session.loginMember != null and session.loginMember.id == post.author.id}">
        <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="action-btn edit-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>
          </svg>
          수정
        </a>
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" class="delete-form"
              onsubmit="return confirm('정말 삭제할까요?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
          <button type="submit" class="action-btn delete-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4h6v2"/>
            </svg>
            삭제
          </button>
        </form>
      </div>
      <!-- 관리자 전용 삭제 (본인 글이 아닐 때, 신고 없이 운영 목적 직접 삭제) -->
      <div class="detail-actions" th:if="${session.loginMember != null and session.loginMember.admin and session.loginMember.id != post.author.id}">
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" class="delete-form"
              onsubmit="return confirm('관리자 권한으로 이 글을 삭제할까요?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
          <button type="submit" class="action-btn delete-btn">🛠️ 관리자 삭제</button>
        </form>
      </div>
      <!-- 신고 버튼 (본인 글이 아닐 때만 표시) -->
      <div class="detail-actions" th:if="${session.loginMember != null and session.loginMember.id != post.author.id}">
        <button type="button" class="action-btn report-btn"
                th:attr="data-target-id=${post.id}, data-target-label=${post.title}"
                onclick="openReportModal('POST', this.dataset.targetId, this.dataset.targetLabel)">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          신고
        </button>
      </div>
    </div>

    <!-- 제목 -->
    <h1 class="detail-title" th:text="${post.title}">게시글 제목</h1>

    <!-- 첨부 사진 (imgUrl 있을 때만 표시) -->
    <div class="detail-img-wrap" th:if="${post.imgUrl != null and !post.imgUrl.trim().isEmpty()}">
      <img th:src="${post.imgUrl}" alt="첨부 사진" class="detail-img" loading="lazy">
    </div>

    <!-- 본문 -->
    <div class="detail-content" th:text="${post.content}">본문 내용</div>

    <!-- 해시태그 (있을 때만 표시) -->
    <div class="detail-tags" th:if="${post.tags != null}">
      <span class="tag-item"
            th:each="tag : ${#strings.arraySplit(post.tags, ',')}"
            th:text="'#' + ${#strings.trim(tag)}">
        #태그
      </span>
    </div>

    <!-- 태그된 맛집 카드 (있을 때만) -->
    <a th:if="${post.restaurant != null}" th:href="@{/map(keyword=${post.restaurant.name})}" class="post-restaurant-card">
      <img th:if="${post.restaurant.imgUrl != null and !post.restaurant.imgUrl.isBlank()}"
           th:src="${post.restaurant.imgUrl}" alt="맛집 사진" class="post-restaurant-card-img" loading="lazy">
      <div th:unless="${post.restaurant.imgUrl != null and !post.restaurant.imgUrl.isBlank()}"
           class="post-restaurant-card-img post-restaurant-card-img-placeholder">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 6v4a1.4 1.4 0 0 0 2.8 0V6M9.6 6v12"/><path d="M15 6c-1.1 1.6-1.1 3.4 0 5v7"/></svg>
      </div>
      <div class="post-restaurant-card-body">
        <span class="post-restaurant-card-label">태그된 맛집</span>
        <h4 class="post-restaurant-card-name" th:text="${post.restaurant.name}">식당 이름</h4>
        <div class="post-restaurant-card-meta">
          <span class="post-restaurant-card-cat" th:text="${post.restaurant.category}">한식</span>
          <span class="post-restaurant-card-rating">★ <th:block th:text="${post.restaurant.rating}">4.5</th:block></span>
        </div>
      </div>
      <svg class="post-restaurant-card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <!-- 구분선 -->
    <div class="detail-divider"></div>

    <!-- 좋아요 / 댓글 수 -->
    <div class="detail-reactions">
      <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post" class="like-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">
        <button type="submit" class="reaction-btn like-btn"
                th:classappend="${isLiked} ? 'active' : ''"
                th:title="${isLiked} ? '좋아요 취소' : '좋아요'">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               th:attr="fill=${isLiked} ? '#EF4444' : 'none', stroke=${isLiked} ? '#EF4444' : 'currentColor'">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span th:text="${isLiked} ? '좋아요' : '좋아요'">좋아요</span>
          <span class="like-num" th:text="${post.likeCount}">0</span>
        </button>
      </form>
      <span class="reaction-count">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        댓글 <span th:text="${post.commentCount}">0</span>
      </span>
      <button class="reaction-btn save-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        저장
      </button>
    </div>

  </article>

  <!-- 댓글 영역 -->
  <div class="comment-section">
    <h3 class="comment-title">
      댓글 <span class="comment-badge" th:text="${comments != null ? comments.size() : 0}">0</span>
    </h3>

    <!-- 댓글이 없을 때 -->
    <div class="comment-empty" th:if="${comments == null or comments.isEmpty()}">
      <span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <p>아직 댓글이 없습니다. 첫 번째 댓글을 남겨보세요!</p>
    </div>

    <!-- 댓글 목록 -->
    <div class="comment-list" th:unless="${comments == null or comments.isEmpty()}">
      <div class="comment-item" th:each="c : ${comments}">
        <!-- 댓글 작성자 아바타 — 익명 처리(실제 프로필 사진 노출 안 함) -->
        <div class="comment-avatar-default"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>

        <div class="comment-body">
          <div class="comment-meta">
            <span class="comment-author-name" th:text="${anonLabels.get(c.author.id)}">익명2</span>
            <span class="comment-date" th:text="${#temporals.format(c.createdAt, 'yyyy.MM.dd HH:mm')}">2026.01.01</span>

            <!-- 액션 버튼들 (답글 / 수정 / 삭제) -->
            <div class="comment-actions">
              <!-- 로그인 회원: 답글 달기 버튼 -->
              <button th:if="${session.loginMember != null}" type="button" class="comment-act-btn reply"
                      th:onclick="'toggleReplyForm(' + ${c.id} + ')'">답글</button>

              <!-- 본인 댓글: 수정 / 삭제 -->
              <th:block th:if="${session.loginMember != null and session.loginMember.id == c.author.id}">
                <span class="comment-act-divider">·</span>
                <button type="button" class="comment-act-btn" th:onclick="'toggleEditComment(' + ${c.id} + ')'">수정</button>
                <span class="comment-act-divider">·</span>
                <form th:action="@{/posts/{id}/comments/{commentId}/delete(id=${post.id}, commentId=${c.id})}"
                      method="post" class="comment-del-form"
                      onsubmit="return confirm('댓글을 삭제할까요?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                  <button type="submit" class="comment-act-btn del">삭제</button>
                </form>
              </th:block>
              <!-- 본인 댓글이 아니면 신고 -->
              <th:block th:if="${session.loginMember != null and session.loginMember.id != c.author.id}">
                <span class="comment-act-divider">·</span>
                <button type="button" class="comment-act-btn"
                        th:attr="data-target-id=${c.id}, data-target-label=${#strings.abbreviate(c.content, 30)}"
                        onclick="openReportModal('COMMENT', this.dataset.targetId, this.dataset.targetLabel)">신고</button>
              </th:block>
              <!-- 관리자: 본인 댓글이 아니어도 신고 없이 직접 삭제 -->
              <th:block th:if="${session.loginMember != null and session.loginMember.admin and session.loginMember.id != c.author.id}">
                <span class="comment-act-divider">·</span>
                <form th:action="@{/posts/{id}/comments/{commentId}/delete(id=${post.id}, commentId=${c.id})}"
                      method="post" class="comment-del-form"
                      onsubmit="return confirm('관리자 권한으로 이 댓글을 삭제할까요?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                  <button type="submit" class="comment-act-btn del">🛠️ 관리자 삭제</button>
                </form>
              </th:block>
            </div>
          </div>

          <!-- 댓글 내용 — 신고 누적 자동 숨김이면 안내문구로 대체(트리 구조 유지 위해 자리는 남김) -->
          <div class="comment-text" th:id="'commentText-' + ${c.id}"
               th:text="${c.hidden} ? '신고가 누적되어 검토 중인 댓글입니다.' : ${c.content}"
               th:classappend="${c.hidden} ? 'comment-text-hidden' : ''">댓글 본문</div>

          <!-- 댓글 인라인 수정 폼 -->
          <form th:if="${session.loginMember != null and session.loginMember.id == c.author.id}"
                th:action="@{/posts/{id}/comments/{commentId}/edit(id=${post.id}, commentId=${c.id})}"
                method="post" class="comment-edit-form" th:id="'commentEditForm-' + ${c.id}"><input type="hidden" name="_csrf" th:value="${csrfToken}">
            <input type="text" name="content" th:value="${c.content}" class="comment-edit-input" required autocomplete="off">
            <div class="comment-edit-btns">
              <button type="submit" class="comment-save-btn">저장</button>
              <button type="button" class="comment-cancel-btn" th:onclick="'toggleEditComment(' + ${c.id} + ')'">취소</button>
            </div>
          </form>

          <!-- 대댓글(답글) 작성 폼 (초기 숨김) -->
          <form th:if="${session.loginMember != null}"
                th:action="@{/posts/{id}/comments(id=${post.id})}" method="post"
                class="reply-write-form" th:id="'replyForm-' + ${c.id}"><input type="hidden" name="_csrf" th:value="${csrfToken}">
            <input type="hidden" name="parentId" th:value="${c.id}">
            <input type="text" name="content" class="reply-input" placeholder="답글을 남겨보세요..." required autocomplete="off">
            <div class="comment-edit-btns">
              <button type="submit" class="comment-save-btn">답글 등록</button>
              <button type="button" class="comment-cancel-btn" th:onclick="'toggleReplyForm(' + ${c.id} + ')'">취소</button>
            </div>
          </form>

          <!-- ================= 대댓글 목록 ================= -->
          <div class="reply-list" th:if="${c.replies != null and !c.replies.isEmpty()}">
            <div class="reply-item" th:each="r : ${c.replies}">
              <div class="reply-arrow">↳</div>
              <div class="comment-avatar-default reply-avatar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>

              <div class="reply-body">
                <div class="comment-meta">
                  <span class="comment-author-name" th:text="${anonLabels.get(r.author.id)}">익명3</span>
                  <span class="comment-date" th:text="${#temporals.format(r.createdAt, 'yyyy.MM.dd HH:mm')}">2026.01.01</span>

                  <!-- 본인 대댓글 수정 / 삭제 -->
                  <div th:if="${session.loginMember != null and session.loginMember.id == r.author.id}" class="comment-actions">
                    <button type="button" class="comment-act-btn" th:onclick="'toggleEditComment(' + ${r.id} + ')'">수정</button>
                    <span class="comment-act-divider">·</span>
                    <form th:action="@{/posts/{id}/comments/{commentId}/delete(id=${post.id}, commentId=${r.id})}"
                          method="post" class="comment-del-form"
                          onsubmit="return confirm('답글을 삭제할까요?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                      <button type="submit" class="comment-act-btn del">삭제</button>
                    </form>
                  </div>
                  <!-- 본인 대댓글이 아니면 신고 -->
                  <div th:if="${session.loginMember != null and session.loginMember.id != r.author.id}" class="comment-actions">
                    <button type="button" class="comment-act-btn"
                            th:attr="data-target-id=${r.id}, data-target-label=${#strings.abbreviate(r.content, 30)}"
                            onclick="openReportModal('COMMENT', this.dataset.targetId, this.dataset.targetLabel)">신고</button>
                  </div>
                  <!-- 관리자: 본인 대댓글이 아니어도 신고 없이 직접 삭제 -->
                  <div th:if="${session.loginMember != null and session.loginMember.admin and session.loginMember.id != r.author.id}" class="comment-actions">
                    <form th:action="@{/posts/{id}/comments/{commentId}/delete(id=${post.id}, commentId=${r.id})}"
                          method="post" class="comment-del-form"
                          onsubmit="return confirm('관리자 권한으로 이 답글을 삭제할까요?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                      <button type="submit" class="comment-act-btn del">🛠️ 관리자 삭제</button>
                    </form>
                  </div>
                </div>

                <!-- 대댓글 내용 — 신고 누적 자동 숨김이면 안내문구로 대체 -->
                <div class="comment-text" th:id="'commentText-' + ${r.id}"
                     th:text="${r.hidden} ? '신고가 누적되어 검토 중인 답글입니다.' : ${r.content}"
                     th:classappend="${r.hidden} ? 'comment-text-hidden' : ''">답글 본문</div>

                <!-- 대댓글 인라인 수정 폼 -->
                <form th:if="${session.loginMember != null and session.loginMember.id == r.author.id}"
                      th:action="@{/posts/{id}/comments/{commentId}/edit(id=${post.id}, commentId=${r.id})}"
                      method="post" class="comment-edit-form" th:id="'commentEditForm-' + ${r.id}"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                  <input type="text" name="content" th:value="${r.content}" class="comment-edit-input" required autocomplete="off">
                  <div class="comment-edit-btns">
                    <button type="submit" class="comment-save-btn">저장</button>
                    <button type="button" class="comment-cancel-btn" th:onclick="'toggleEditComment(' + ${r.id} + ')'">취소</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <!-- ================= /대댓글 목록 ================= -->

        </div>
      </div>
    </div>

    <!-- 댓글 입력창 -->
    <!-- 로그인 상태: 작성 폼 노출 -->
    <form th:if="${session.loginMember != null}"
          th:action="@{/posts/{id}/comments(id=${post.id})}" method="post" class="comment-input-wrap"><input type="hidden" name="_csrf" th:value="${csrfToken}">
      <img th:if="${session.loginMember.profileImage != null}"
           th:src="${session.loginMember.profileImage}" alt="내 프로필" class="comment-avatar">
      <div th:unless="${session.loginMember.profileImage != null}" class="comment-avatar-default"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <input type="text" name="content" class="comment-input" placeholder="따뜻한 댓글을 남겨보세요..." required autocomplete="off">
      <button type="submit" class="comment-submit">등록</button>
    </form>

    <!-- 미로그인 상태: 로그인 유도 -->
    <div th:unless="${session.loginMember != null}" class="comment-login-box">
      <span>댓글을 작성하려면 <a th:href="@{/login}">로그인</a>이 필요합니다.</span>
    </div>
  </div>

</main>

<script>
  function toggleEditComment(commentId) {
    const textEl = document.getElementById('commentText-' + commentId);
    const formEl = document.getElementById('commentEditForm-' + commentId);
    if (!formEl.classList.contains('active')) {
      formEl.classList.add('active');
      textEl.style.display = 'none';
      formEl.querySelector('input').focus();
    } else {
      formEl.classList.remove('active');
      textEl.style.display = 'block';
    }
  }

  function toggleReplyForm(commentId) {
    const replyForm = document.getElementById('replyForm-' + commentId);
    if (!replyForm.classList.contains('active')) {
      replyForm.classList.add('active');
      replyForm.querySelector('input[name="content"]').focus();
    } else {
      replyForm.classList.remove('active');
    }
  }
</script>

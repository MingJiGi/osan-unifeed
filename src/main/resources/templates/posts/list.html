<!DOCTYPE html>
<!--
  커뮤니티 피드 목록 화면 (posts/list.html)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 커뮤니티')}"></th:block>
</head>

<body class="feed-body">

<!-- 공통 GNB 헤더 -->
<header th:replace="~{fragments/layout :: gnb('posts')}"></header>

<!-- 메인 컨텐츠 -->
<main class="feed-container">

  <!-- 필터 칩: 전체=전체보기, 인기=좋아요순 정렬, 나머지=제목·내용·해시태그 텍스트 필터 -->
  <div class="chip-row" id="chipRow">
    <button type="button" class="chip chip-active" onclick="handleChipClick(this)">전체</button>
    <button type="button" class="chip" onclick="handleChipClick(this)">🔥 인기</button>
    <button type="button" class="chip" onclick="handleChipClick(this)">자유</button>
    <button type="button" class="chip" onclick="handleChipClick(this)">일상/소통</button>
    <button type="button" class="chip" onclick="handleChipClick(this)">질문</button>
    <button type="button" class="chip" onclick="handleChipClick(this)">캠퍼스꿀팁</button>
    <button type="button" class="chip" onclick="handleChipClick(this)">맛집/학식</button>
  </div>

  <!-- 글 없을 때 -->
  <p class="feed-empty" th:if="${posts.isEmpty()}">
    아직 등록된 게시글이 없습니다. 학우들과 나누고 싶은 첫 번째 이야기를 작성해보세요! ✍️
  </p>

  <!-- 카드 그리드 -->
  <div class="feed-grid" th:unless="${posts.isEmpty()}">
    <a th:href="@{/posts/{id}(id=${post.id})}" class="feed-card-link"
       th:each="post : ${posts}">
      <div class="feed-card">

        <!-- 작성자 정보 -->
        <div class="card-author">
          <img th:if="${post.author.profileImage != null}"
               th:src="${post.author.profileImage}"
               alt="프로필" class="author-avatar">
          <div th:unless="${post.author.profileImage != null}"
               class="author-avatar-default"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div class="author-info">
            <span class="author-name" th:text="${post.author.name}">작성자</span>
            <span class="author-meta">
              <span th:text="${#temporals.format(post.createdAt, 'MM/dd HH:mm')}">00/00</span>
            </span>
          </div>
        </div>

        <!-- 첨부 사진 (이미지가 있을 때만 표시) -->
        <div class="card-img-wrap" th:if="${post.imgUrl != null and !post.imgUrl.trim().isEmpty()}">
          <img th:src="${post.imgUrl}" alt="첨부 사진" class="card-img">
        </div>

        <!-- 카드 바디 -->
        <div class="card-body">
          <h3 class="card-title" th:text="${post.title}">제목</h3>
          <p class="card-content" th:text="${post.content}">본문</p>

          <p class="card-tags" th:if="${post.tags != null}" th:text="${post.tags}">
            #해시태그
          </p>

          <div class="card-footer">
            <div class="card-reactions">
              <span class="reaction reaction-like">
                <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
                <span th:text="${post.likeCount}">0</span>
              </span>
              <span class="reaction reaction-comment">
                <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span th:text="${post.commentCount}">0</span>
              </span>
            </div>
            <span class="card-save">
              <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
              </svg>
              <span>저장</span>
            </span>
          </div>
        </div>

      </div>
    </a>
  </div>

</main>

<!-- FAB: 새 글 작성 -->
<a href="javascript:void(0)" class="fab" onclick="openModal(event)">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
    <path d="m15 5 4 4"/>
  </svg>
  <span>새 글 작성</span>
</a>

<!-- 새 글 작성 모달 (배경 블러 처리) -->
<div class="modal-overlay" id="writeModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">
        <svg class="modal-title-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          <path d="m15 5 4 4"/>
        </svg>
        <span>새 글 작성하기</span>
      </h2>
      <button type="button" class="modal-close-btn" onclick="closeModal()">&times;</button>
    </div>

    <form th:action="@{/posts}" th:object="${postForm}" method="post" class="modal-form"
          onsubmit="if (postImageUploading) { showToast('이미지 업로드가 끝난 뒤 등록해주세요.', 'info'); return false; }">
      <div class="form-group">
        <label for="title" class="form-label">글 제목</label>
        <input type="text" th:field="*{title}" id="title" class="form-control" placeholder="제목을 입력하세요" required>
        <p class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
      </div>

      <div class="form-group">
        <label for="tags" class="form-label">해시태그 (선택)</label>
        <input type="text" th:field="*{tags}" id="tags" class="form-control" placeholder="#일상 #질문 #공강 #동아리">
      </div>

      <div class="form-group">
        <label for="imgFile" class="form-label">사진 (선택)</label>
        <label for="imgFile" class="img-upload-box" id="imgUploadBox">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="img-upload-box-text" id="imgUploadBoxText">클릭해서 사진 선택 (jpg·png·gif·webp, 5MB 이하)</span>
        </label>
        <input type="file" id="imgFile" accept="image/*" class="img-upload-input-hidden" onchange="handlePostImageSelect(event)">
        <p id="imgUploadStatus" class="img-upload-status"></p>
        <img id="imgPreview" alt="미리보기" class="img-upload-preview" style="display:none;">
        <input type="hidden" th:field="*{imgUrl}" id="imgUrl">
      </div>

      <div class="form-group">
        <label for="restaurantSearchInput" class="form-label">맛집 태그 (선택)</label>
        <input type="text" id="restaurantSearchInput" class="form-control" placeholder="태그할 맛집 이름을 검색하세요" oninput="searchRestaurantsForTag(this.value)" autocomplete="off">
        <div id="restaurantSearchResults" class="restaurant-tag-results"></div>
        <div id="restaurantTagChip" class="restaurant-tag-chip" style="display:none;">
          <span id="restaurantTagChipText"></span>
          <button type="button" onclick="clearRestaurantTag()" aria-label="맛집 태그 제거">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <input type="hidden" th:field="*{restaurantId}" id="restaurantId">
      </div>

      <div class="form-group">
        <label for="content" class="form-label">내용</label>
        <textarea th:field="*{content}" id="content" class="form-control textarea" rows="4" placeholder="학우들과 자유롭게 나누고 싶은 일상, 질문, 이야기 등을 작성해보세요!" required></textarea>
        <p class="form-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
        <button type="submit" class="btn-submit">등록하기</button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/post-widgets.js(v='1')}"></script>
<script th:inline="javascript">
  function handleChipClick(chip) {
    document.querySelectorAll('#chipRow .chip').forEach(c => c.classList.remove('chip-active'));
    chip.classList.add('chip-active');
    applyChipFilter(chip.textContent.trim());
  }

  function applyChipFilter(rawLabel) {
    // 이모지 등 특수문자 제거하고 텍스트만 비교
    const label = rawLabel.replace(/[^\p{L}\p{N}\s]/gu, '').trim();
    const grid = document.querySelector('.feed-grid');
    if (!grid) return;
    const cards = Array.from(grid.querySelectorAll('.feed-card-link'));

    if (label === '전체') {
      cards.forEach(c => { c.style.display = ''; });
      return;
    }

    if (label === '인기') {
      cards.forEach(c => { c.style.display = ''; });
      cards
        .sort((a, b) => {
          const likeA = parseInt(a.querySelector('.reaction-like span')?.textContent || '0', 10);
          const likeB = parseInt(b.querySelector('.reaction-like span')?.textContent || '0', 10);
          return likeB - likeA;
        })
        .forEach(c => grid.appendChild(c));
      return;
    }

    // 그 외 칩은 제목/내용/해시태그에 그 단어가 들어간 글만 보여준다(글에 실제 카테고리 필드가 없어서 텍스트 매칭으로 대체).
    cards.forEach(c => {
      c.style.display = c.textContent.includes(label) ? '' : 'none';
    });
  }

  function openModal(e) {
    if(e) e.preventDefault();
    const modal = document.getElementById('writeModal');
    if(modal) modal.classList.add('active');
  }

  function closeModal() {
    const modal = document.getElementById('writeModal');
    if(modal) modal.classList.remove('active');
  }

  window.addEventListener('click', function(e) {
    const modal = document.getElementById('writeModal');
    if (e.target === modal) {
      closeModal();
    }
  });

  /*[# th:if="${hasError}"]*/
  document.addEventListener('DOMContentLoaded', function() {
    openModal();
  });
  /*[/]*/
</script>

</body>
</html>

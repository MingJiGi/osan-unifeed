<!DOCTYPE html>
<!--
  게시판 목록 화면
  ----------------------------------------------------------------------------
  컨트롤러가 model 에 담아준 ${posts} 를 표로 그린다.
  - th:replace : 공통 조각(head/nav)을 끼워 넣는다
  - th:each    : 리스트를 반복해 <tr> 을 여러 줄 만든다
  - th:text    : 태그 안의 텍스트를 서버 값으로 바꾼다
  - @{...}     : 링크 URL (컨텍스트 경로 자동 처리)
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('게시판')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<h1>게시판</h1>

<!-- 글이 하나도 없을 때 -->
<p class="empty" th:if="${posts.isEmpty()}">아직 글이 없습니다. 첫 글을 써보세요!</p>

<!-- 글이 있을 때만 표를 그린다 -->
<table th:unless="${posts.isEmpty()}">
	<thead>
	<tr>
		<th class="w-60">번호</th>
		<th>제목</th>
		<th class="w-120">작성자</th>
		<th class="w-150">작성일</th>
	</tr>
	</thead>
	<tbody>
	<!-- posts 의 각 원소를 post 라는 이름으로 반복 -->
	<tr th:each="post : ${posts}">
		<td th:text="${post.id}">1</td>
		<td>
			<!-- 제목을 누르면 상세로. @{/posts/{id}(id=${post.id})} = /posts/1 처럼 완성된다 -->
			<a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">제목</a>
		</td>
		<!-- post.author 는 join fetch 로 이미 읽어와서 안전하게 접근된다 -->
		<td class="muted" th:text="${post.author.name}">작성자</td>
		<td class="muted" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
	</tr>
	</tbody>
</table>
</body>
</html>

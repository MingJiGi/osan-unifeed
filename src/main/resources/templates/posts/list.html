<!DOCTYPE html>
<!--
  커뮤니티 피드 목록 화면 (posts/list.html)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 커뮤니티')}"></th:block>
  <!-- 분리된 피드 전용 CSS -->
  <link rel="stylesheet" th:href="@{/css/list.css}">
</head>

<body class="feed-body">

<!-- GNB 헤더 -->
<header class="gnb">
  <!-- 맨 왼쪽: 로고 + "유니피드" 글씨 -->
  <a th:href="@{/}" class="gnb-logo">
    <img th:src="@{/images/UNIFEED_LOGO.png}" alt="유니피드" class="gnb-logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <span class="gnb-logo-fallback">🍊</span>
    <span class="gnb-logo-text">유니피드</span>
  </a>

  <!-- 가운데: 메뉴들 -->
  <nav class="gnb-nav">
    <a th:href="@{/map}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
        <line x1="9" y1="3" x2="9" y2="18"/>
        <line x1="15" y1="6" x2="15" y2="21"/>
      </svg>
      <span>지도</span>
    </a>
    <a th:href="@{/posts}" class="gnb-nav-link active">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>커뮤니티</span>
    </a>
    <a th:href="@{/timetable}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>시간표</span>
    </a>
    <a th:href="@{/mypage}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>마이페이지</span>
    </a>
  </nav>

  <!-- 맨 오른쪽: 검색바 + 로그인 상태 -->
  <div class="gnb-right">
    <div class="gnb-search">
      <input type="text" placeholder="내 주변 맛집 검색" class="gnb-search-input">
      <span class="gnb-search-icon">🔍</span>
    </div>

    <!-- 로그인 상태: 아바타 + 이름 + 로그아웃 -->
    <div th:if="${session.loginMember != null}" class="gnb-user">
      <!-- 프로필 이미지 (없으면 기본 아바타) -->
      <img th:if="${session.loginMember.profileImage != null}"
           th:src="${session.loginMember.profileImage}"
           alt="프로필" class="gnb-avatar">
      <div th:unless="${session.loginMember.profileImage != null}"
           class="gnb-avatar-default">👤</div>
      <!-- 이름 -->
      <span class="gnb-username" th:text="${session.loginMember.name}">홍길동</span>
      <!-- 로그아웃 -->
      <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit" class="gnb-logout-btn">로그아웃</button>
      </form>
    </div>

    <!-- 미로그인 상태: 로그인 버튼 -->
    <a th:unless="${session.loginMember != null}"
       th:href="@{/login}" class="gnb-login-link">로그인</a>
  </div>
</header>

<!-- 메인 컨텐츠 -->
<main class="feed-container">

  <!-- 필터 칩 -->
  <div class="chip-row">
    <button class="chip chip-active">전체</button>
    <button class="chip">🔥 인기</button>
    <button class="chip">맛집추천</button>
    <button class="chip">가성비</button>
    <button class="chip">카페/카공</button>
    <button class="chip">학식후기</button>
  </div>

  <!-- 글 없을 때 -->
  <p class="feed-empty" th:if="${posts.isEmpty()}">
    아직 게시글이 없습니다. 첫 번째 맛집 리뷰를 남겨보세요! 🍜
  </p>

  <!-- 카드 그리드 -->
  <div class="feed-grid" th:unless="${posts.isEmpty()}">
    <a th:href="@{/posts/{id}(id=${post.id})}" class="feed-card-link"
       th:each="post : ${posts}">
      <div class="feed-card">

        <!-- 작성자 정보 -->
        <div class="card-author">
          <img th:if="${post.author.profileImage != null}"
               th:src="${post.author.profileImage}"
               alt="프로필" class="author-avatar">
          <div th:unless="${post.author.profileImage != null}"
               class="author-avatar-default">👤</div>
          <div class="author-info">
            <span class="author-name" th:text="${post.author.name}">작성자</span>
            <span class="author-meta">
              오산대학교 ·
              <span th:text="${#temporals.format(post.createdAt, 'MM/dd HH:mm')}">00/00</span>
            </span>
          </div>
        </div>

        <!-- 음식 사진 -->
        <div class="card-img-wrap">
          <img th:if="${post.imgUrl != null}"
               th:src="${post.imgUrl}"
               alt="음식 사진" class="card-img">
          <img th:unless="${post.imgUrl != null}"
               th:src="@{/images/food1.jpg}"
               alt="음식 사진" class="card-img">
        </div>

        <!-- 카드 바디 -->
        <div class="card-body">
          <h3 class="card-title" th:text="${post.title}">제목</h3>
          <p class="card-content" th:text="${post.content}">본문</p>

          <p class="card-tags" th:if="${post.tags != null}" th:text="${post.tags}">
            #해시태그
          </p>

          <div class="card-footer">
            <div class="card-reactions">
              <span class="reaction reaction-like">
                <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
                <span th:text="${post.likeCount}">0</span>
              </span>
              <span class="reaction reaction-comment">
                <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span th:text="${post.commentCount}">0</span>
              </span>
            </div>
            <span class="card-save">
              <svg class="card-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
              </svg>
              <span>저장</span>
            </span>
          </div>
        </div>

      </div>
    </a>
  </div>

</main>

<!-- FAB: 새 글 작성 -->
<a href="javascript:void(0)" class="fab" onclick="openModal(event)">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
    <path d="m15 5 4 4"/>
  </svg>
  <span>새 글 작성</span>
</a>

<!-- 새 글 작성 모달 (배경 블러 처리) -->
<div class="modal-overlay" id="writeModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">
        <svg class="modal-title-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          <path d="m15 5 4 4"/>
        </svg>
        <span>새 글 작성하기</span>
      </h2>
      <button type="button" class="modal-close-btn" onclick="closeModal()">&times;</button>
    </div>

    <form th:action="@{/posts}" th:object="${postForm}" method="post" class="modal-form">
      <div class="form-group">
        <label for="title" class="form-label">글 제목</label>
        <input type="text" th:field="*{title}" id="title" class="form-control" placeholder="맛집 이름이나 제목을 입력하세요" required>
        <p class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
      </div>

      <div class="form-group">
        <label for="tags" class="form-label">해시태그 (선택)</label>
        <input type="text" th:field="*{tags}" id="tags" class="form-control" placeholder="#오산대맛집 #가성비 #카공">
      </div>

      <div class="form-group">
        <label for="imgUrl" class="form-label">이미지 URL (선택)</label>
        <input type="text" th:field="*{imgUrl}" id="imgUrl" class="form-control" placeholder="https://example.com/image.jpg">
      </div>

      <div class="form-group">
        <label for="content" class="form-label">내용</label>
        <textarea th:field="*{content}" id="content" class="form-control textarea" rows="4" placeholder="맛있는 메뉴와 솔직한 리뷰를 남겨주세요!" required></textarea>
        <p class="form-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
        <button type="submit" class="btn-submit">등록하기</button>
      </div>
    </form>
  </div>
</div>

<script th:inline="javascript">
  function openModal(e) {
    if(e) e.preventDefault();
    const modal = document.getElementById('writeModal');
    if(modal) modal.classList.add('active');
  }

  function closeModal() {
    const modal = document.getElementById('writeModal');
    if(modal) modal.classList.remove('active');
  }

  window.addEventListener('click', function(e) {
    const modal = document.getElementById('writeModal');
    if (e.target === modal) {
      closeModal();
    }
  });

  /*[# th:if="${hasError}"]*/
  document.addEventListener('DOMContentLoaded', function() {
    openModal();
  });
  /*[/]*/
</script>

</body>
</html>

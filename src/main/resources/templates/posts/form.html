<!DOCTYPE html>
<!--
  글 작성/수정 폼 (posts/form.html)
  ----------------------------------------------------------------------------
  - 새 글: GET /posts/new → POST /posts
  - 수정:  GET /posts/{id}/edit → POST /posts/{id}
  - th:object="${postForm}" : 이 폼이 다룰 DTO 객체 지정
  - th:field="*{필드명}"   : name/id/value 를 postForm 필드와 자동 연결
  - th:errors="*{필드명}"  : 검증 실패 메시지 출력
  ----------------------------------------------------------------------------
  authorId: 로그인 구현 전까지 members 목록의 첫 번째 회원을 hidden으로 자동 선택
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head(${postId} != null ? '글 수정' : '새 게시글 작성')}"></head>

<body class="form-body">

<!-- GNB 헤더 -->
<header class="gnb">
  <div class="gnb-left">
    <a th:href="@{/}" class="gnb-logo">
      <img th:src="@{/images/logo.png}" alt="유니피드" class="gnb-logo-img"
           onerror="this.style.display='none'">
      <span class="gnb-logo-text">유니피드</span>
    </a>
    <nav class="gnb-nav">
      <a th:href="@{/map}"   class="gnb-nav-link">🗺️ 지도</a>
      <a th:href="@{/posts}" class="gnb-nav-link active">💬 커뮤니티</a>
      <a th:href="@{/timetable}" class="gnb-nav-link">📅 시간표</a>
      <a th:href="@{/mypage}"    class="gnb-nav-link">👤 마이페이지</a>
    </nav>
  </div>
  <div class="gnb-right">
    <div class="gnb-search">
      <input type="text" placeholder="내 주변 맛집 검색" class="gnb-search-input">
      <span class="gnb-search-icon">🔍</span>
    </div>
    <img th:src="@{/images/avatar.jpg}" alt="프로필" class="gnb-avatar">
  </div>
</header>

<!-- 어두운 배경 오버레이 -->
<div class="overlay"></div>

<!-- 모달 카드 -->
<div class="modal-card">

  <!-- 모달 헤더 -->
  <div class="modal-header">
    <h2 class="modal-title" th:text="${postId} != null ? '게시글 수정' : '새 게시글 작성'">새 게시글 작성</h2>
    <a th:href="@{/posts}" class="modal-close">✕</a>
  </div>

  <!-- 폼 시작 -->
  <form th:object="${postForm}" method="post"
        th:action="${postId} != null ? @{/posts/{id}(id=${postId})} : @{/posts}"
        class="modal-form">

    <!--
      authorId hidden 필드: 로그인 구현 전까지 members 중 첫 번째 회원 자동 선택
      members 리스트는 컨트롤러가 model에 담아줌
    -->
    <select th:field="*{authorId}" style="display:none">
      <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}">회원</option>
    </select>

    <!-- 맛집 선택 (시각적 UI - 추후 DB 연동 예정) -->
    <div class="form-group">
      <label class="form-label">맛집 선택 <span class="required">*</span></label>
      <input type="text" class="form-input" placeholder="가게 이름 검색...">
    </div>

    <!-- 글 제목 -->
    <div class="form-group">
      <label class="form-label" for="title">글 제목 <span class="required">*</span></label>
      <input type="text" id="title" th:field="*{title}"
             class="form-input" placeholder="맛집 경험을 한 줄로 요약해 보세요!">
      <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">제목 오류</div>
    </div>

    <!-- 내용 -->
    <div class="form-group">
      <label class="form-label" for="content">내용 <span class="required">*</span></label>
      <textarea id="content" th:field="*{content}"
                class="form-textarea" placeholder="생생한 미식 후기를 자유롭게 작성해 주세요!"
                maxlength="500" oninput="updateCounter(this)"></textarea>
      <div class="textarea-footer">
        <div class="form-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">내용 오류</div>
        <span class="char-counter" id="charCounter">0/500</span>
      </div>
    </div>

    <!-- 해시태그 -->
    <div class="form-group">
      <label class="form-label" for="tags">해시태그</label>
      <input type="text" id="tags" th:field="*{tags}"
             class="form-input" placeholder="예: 오산대, 가성비, 맛집 (쉼표로 구분)"
             maxlength="300">
      <div class="form-error" th:if="${#fields.hasErrors('tags')}" th:errors="*{tags}">태그 오류</div>
    </div>

    <!-- 별점 (시각적 UI - 추후 DB 연동 예정) -->
    <div class="form-group">
      <label class="form-label">별점</label>
      <div class="star-rating">
        <span class="star" onclick="setRating(1)">☆</span>
        <span class="star" onclick="setRating(2)">☆</span>
        <span class="star" onclick="setRating(3)">☆</span>
        <span class="star" onclick="setRating(4)">☆</span>
        <span class="star" onclick="setRating(5)">☆</span>
      </div>
    </div>

    <!-- 음식 사진 (시각적 UI - 추후 파일 업로드 연동 예정) -->
    <div class="form-group">
      <label class="form-label">음식 사진 <span class="photo-count">(0/5)</span></label>
      <div class="photo-upload-area">
        <span class="photo-upload-icon">📷</span>
        <span class="photo-upload-text">사진 추가</span>
      </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="modal-footer">
      <a th:href="@{/posts}" class="btn-cancel">취소</a>
      <button type="submit" class="btn-submit"
              th:text="${postId} != null ? '수정하기' : '게시하기'">게시하기</button>
    </div>

  </form>
</div>

<script>
  // 글자 수 카운터 업데이트
  function updateCounter(textarea) {
    document.getElementById('charCounter').textContent = textarea.value.length + '/500';
  }

  // 별점 UI
  const stars = document.querySelectorAll('.star');
  function setRating(n) {
    stars.forEach((s, i) => {
      s.textContent = i < n ? '★' : '☆';
      s.style.color  = i < n ? '#F97316' : '#CBD5E1';
    });
  }

  // members 드롭다운에서 첫 번째 회원 자동 선택
  window.addEventListener('DOMContentLoaded', () => {
    const sel = document.querySelector('select[name="authorId"]');
    if (sel && !sel.value && sel.options.length > 1) {
      sel.selectedIndex = 1; // 첫 번째 실제 회원 선택
    }

    // 수정 시 글자 수 카운터 초기화
    const ta = document.getElementById('content');
    if (ta) updateCounter(ta);
  });
</script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body.form-body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  background: #F9FAFB; max-width: none; padding: 0; min-height: 100vh;
}
/* GNB */
.gnb {
  height: 64px; background: #fff; border-bottom: 1px solid #E5E7EB;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; position: relative; z-index: 200;
}
.gnb-left { display: flex; align-items: center; gap: 36px; }
.gnb-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.gnb-logo-img { height: 42px; width: auto; object-fit: contain; }
.gnb-logo-text { font-size: 20px; font-weight: 900; color: #F97316; letter-spacing: -0.5px; }
.gnb-nav { display: flex; gap: 4px; }
.gnb-nav-link {
  text-decoration: none; color: #64748B; font-size: 15px; font-weight: 600;
  padding: 0 14px; height: 64px; display: flex; align-items: center; position: relative;
}
.gnb-nav-link:hover { color: #F97316; text-decoration: none; }
.gnb-nav-link.active { color: #F97316; }
.gnb-nav-link.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: #F97316; border-radius: 2px 2px 0 0;
}
.gnb-right { display: flex; align-items: center; gap: 14px; }
.gnb-search { position: relative; display: flex; align-items: center; }
.gnb-search-input {
  width: 200px; height: 36px; border: 1px solid #E5E7EB; border-radius: 9999px;
  padding: 0 34px 0 14px; font-size: 13px; background: #F8FAFC; outline: none;
}
.gnb-search-icon { position: absolute; right: 12px; color: #94A3B8; }
.gnb-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #FED7AA; }

/* 배경 오버레이 */
.overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
  z-index: 100; top: 64px;
}

/* 모달 카드 */
.modal-card {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 100%; max-width: 520px; max-height: 85vh;
  background: #fff; border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  z-index: 300; display: flex; flex-direction: column;
  overflow: hidden;
}

/* 모달 헤더 */
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 16px; border-bottom: 1px solid #F1F5F9; flex-shrink: 0;
}
.modal-title { font-size: 18px; font-weight: 800; color: #0F172A; }
.modal-close {
  text-decoration: none; color: #94A3B8; font-size: 18px; font-weight: 400;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: all 0.2s;
}
.modal-close:hover { background: #F1F5F9; color: #475569; text-decoration: none; }

/* 폼 영역 (스크롤) */
.modal-form {
  flex: 1; overflow-y: auto; padding: 20px 24px;
  display: flex; flex-direction: column; gap: 18px;
}

/* 폼 그룹 */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 13px; font-weight: 700; color: #1E293B; }
.required { color: #F97316; }
.form-input {
  height: 44px; border: 1.5px solid #E5E7EB; border-radius: 8px;
  padding: 0 14px; font-size: 14px; color: #1E293B; outline: none;
  font-family: inherit; transition: border-color 0.2s;
}
.form-input:focus { border-color: #F97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
.form-textarea {
  border: 1.5px solid #E5E7EB; border-radius: 8px; padding: 12px 14px;
  font-size: 14px; color: #1E293B; outline: none; font-family: inherit;
  resize: none; min-height: 120px; line-height: 1.6; transition: border-color 0.2s;
}
.form-textarea:focus { border-color: #F97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
.textarea-footer { display: flex; justify-content: flex-end; align-items: center; }
.char-counter { font-size: 12px; color: #94A3B8; }
.form-error { font-size: 12px; color: #EF4444; }

/* 별점 */
.star-rating { display: flex; gap: 6px; }
.star { font-size: 26px; color: #CBD5E1; cursor: pointer; transition: color 0.15s; user-select: none; }
.star:hover { color: #F97316; }

/* 사진 업로드 */
.photo-count { font-size: 12px; font-weight: 400; color: #94A3B8; }
.photo-upload-area {
  border: 2px dashed #E5E7EB; border-radius: 10px; padding: 20px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer; transition: border-color 0.2s; color: #94A3B8;
}
.photo-upload-area:hover { border-color: #F97316; color: #F97316; }
.photo-upload-icon { font-size: 24px; }
.photo-upload-text { font-size: 13px; font-weight: 600; }

/* 하단 버튼 */
.modal-footer {
  display: flex; gap: 10px; padding: 16px 24px;
  border-top: 1px solid #F1F5F9; flex-shrink: 0; background: #fff;
}
.btn-cancel {
  flex: 1; height: 46px; display: flex; align-items: center; justify-content: center;
  background: #F1F5F9; color: #64748B; border-radius: 9px; text-decoration: none;
  font-size: 14px; font-weight: 700; transition: background 0.2s;
}
.btn-cancel:hover { background: #E2E8F0; text-decoration: none; color: #475569; }
.btn-submit {
  flex: 2; height: 46px; background: #F97316; color: #fff; border: none;
  border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 12px rgba(249,115,22,0.3); transition: all 0.2s;
}
.btn-submit:hover { background: #EA580C; box-shadow: 0 6px 16px rgba(249,115,22,0.4); }
</style>

</body>
</html>

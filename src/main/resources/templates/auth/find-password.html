<!DOCTYPE html>
<!--
  비밀번호 찾기 화면 (auth/find-password.html)
  ----------------------------------------------------------------------------
  - 1단계: 가입 이메일 입력 -> AuthController.verifyEmailForReset()
  - 2단계(verifiedEmail 있을 때): 새 비밀번호 설정 -> AuthController.resetPassword()
  - [주의] 메일 발송 기능이 없는 학습용 앱이라, 이메일 "소유" 확인이 아니라
           "가입 여부" 확인만 한다. signup.html 과 같은 카드 UI를 재사용.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 비밀번호 찾기')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/signup.css(v='2')}">
</head>

<body class="signup-body">

<main class="signup-main">
  <div class="signup-card">

    <h2 class="signup-title">비밀번호 찾기</h2>
    <p class="signup-subtitle" th:if="${verifiedEmail == null}">가입하신 학교 웹메일을 입력해주세요.</p>
    <p class="signup-subtitle" th:if="${verifiedEmail != null}">확인되었습니다. 새 비밀번호를 설정해주세요.</p>

    <div class="signup-error" th:if="${error}" th:text="${error}"></div>

    <!-- 1단계: 이메일 확인 -->
    <form th:if="${verifiedEmail == null}" th:action="@{/find-password}" method="post" class="signup-form">
      <div class="form-group">
        <label class="form-label" for="email">캠퍼스 웹메일</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="student@univ.ac.kr" required>
      </div>
      <button type="submit" class="signup-btn">이메일 확인</button>
    </form>

    <!-- 2단계: 새 비밀번호 설정 -->
    <form th:if="${verifiedEmail != null}" th:action="@{/find-password/reset}" method="post" class="signup-form">
      <input type="hidden" name="email" th:value="${verifiedEmail}">
      <div class="form-group">
        <label class="form-label" for="newPassword">새 비밀번호</label>
        <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="4자 이상 입력" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="newPasswordConfirm">새 비밀번호 확인</label>
        <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" class="form-input" placeholder="비밀번호 다시 입력" required>
      </div>
      <button type="submit" class="signup-btn">비밀번호 변경</button>
    </form>

    <p class="login-link">
      <a th:href="@{/login}" class="login-anchor">로그인으로 돌아가기</a>
    </p>

  </div>
</main>

</body>
</html>

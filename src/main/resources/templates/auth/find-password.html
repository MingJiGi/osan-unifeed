<!DOCTYPE html>
<!--
  비밀번호 찾기 화면 (auth/find-password.html)
  ----------------------------------------------------------------------------
  - 1단계: 가입 이메일 입력 -> AuthController.requestPasswordReset() -> 메일로 재설정 링크 발송
  - (메일 속 링크 클릭) GET /find-password/reset?token=... -> 토큰 유효하면 새 비밀번호 입력 폼
  - 2단계: 새 비밀번호 설정 -> AuthController.resetPassword() (토큰 재검증 후 저장)
  - 이메일 "소유" 확인 없이 아무나 재설정 가능했던 취약점을 토큰 기반으로 수정함.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 비밀번호 찾기')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/signup.css(v='5')}">
</head>

<body class="signup-body">

<main class="signup-main">
  <div class="signup-card">

    <h2 class="signup-title">비밀번호 찾기</h2>
    <p class="signup-subtitle" th:if="${resetToken == null and requestSent == null}">가입하신 학교 웹메일을 입력해주세요.</p>
    <p class="signup-subtitle" th:if="${requestSent != null}">메일함을 확인해주세요.</p>
    <p class="signup-subtitle" th:if="${resetToken != null}">새 비밀번호를 설정해주세요.</p>

    <div class="signup-error" th:if="${error}" th:text="${error}"></div>

    <!-- 1단계: 이메일 입력 -->
    <form th:if="${resetToken == null and requestSent == null}" th:action="@{/find-password}" method="post" class="signup-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">
      <div class="form-group">
        <label class="form-label" for="email">캠퍼스 웹메일</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="student@univ.ac.kr" autocomplete="email" required>
      </div>
      <button type="submit" class="signup-btn">재설정 링크 받기</button>
    </form>

    <!-- 1단계 완료: 메일 발송 안내 -->
    <p th:if="${requestSent != null}" style="font-size:13px; color:var(--c-slate-500); text-align:center; line-height:1.6; margin:0 0 8px;">
      입력하신 이메일이 가입되어 있다면, 비밀번호 재설정 링크를 보내드렸습니다.<br>
      받은 메일함(스팸함도 확인)에서 링크를 눌러주세요.
    </p>

    <!-- 2단계: 새 비밀번호 설정 (메일 속 링크로 접근, 토큰 보유 시) -->
    <form th:if="${resetToken != null}" th:action="@{/find-password/reset}" method="post" class="signup-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">
      <input type="hidden" name="token" th:value="${resetToken}">
      <div class="form-group">
        <label class="form-label" for="newPassword">새 비밀번호</label>
        <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="8자 이상 입력" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="newPasswordConfirm">새 비밀번호 확인</label>
        <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" class="form-input" placeholder="비밀번호 다시 입력" autocomplete="new-password" required>
      </div>
      <button type="submit" class="signup-btn">비밀번호 변경</button>
    </form>

    <p class="login-link">
      <a th:href="@{/login}" class="login-anchor">로그인으로 돌아가기</a>
    </p>

  </div>
</main>

</body>
</html>

<!DOCTYPE html>
<!--
  회원가입 화면 (auth/signup.html)
  ----------------------------------------------------------------------------
  - th:object="${signupForm}" : SignupForm DTO 와 폼 연결
  - th:action="@{/signup}"   : POST /signup 으로 제출
  - signupError 가 있으면 에러 메시지 표시
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 회원가입')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/list.css}">
  <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>

<body class="signup-body">

<!-- GNB (list.html 과 동일한 공통 헤더) -->
<header class="gnb">
  <a th:href="@{/}" class="gnb-logo">
    <img th:src="@{/images/UNIFEED_LOGO.png}" alt="유니피드" class="gnb-logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <span class="gnb-logo-fallback">🍊</span>
    <span class="gnb-logo-text">유니피드</span>
  </a>

  <nav class="gnb-nav">
    <a th:href="@{/map}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
        <line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>
      </svg>
      <span>지도</span>
    </a>
    <a th:href="@{/posts}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>커뮤니티</span>
    </a>
    <a th:href="@{/timetable}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>시간표</span>
    </a>
    <a th:href="@{/mypage}" class="gnb-nav-link">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span>마이페이지</span>
    </a>
  </nav>

  <div class="gnb-right">
    <div class="gnb-search">
      <input type="text" placeholder="맛집 검색" class="gnb-search-input">
      <span class="gnb-search-icon">🔍</span>
    </div>
    <a th:href="@{/login}" class="gnb-login-btn">로그인</a>
  </div>
</header>

<!-- 메인 영역 -->
<main class="signup-main">

  <!-- 회원가입 카드 -->
  <div class="signup-card">

    <!-- 로고 -->
    <div class="signup-logo">
      <img th:src="@{/images/UNIFEED_LOGO.png}" alt="유니피드" class="signup-logo-img"
           onerror="this.style.display='none'">
    </div>

    <h2 class="signup-title">회원가입</h2>
    <p class="signup-subtitle">대학 웹메일로 가입하고 캠퍼스 맛집 정보를 공유하세요</p>

    <!-- 에러 메시지 -->
    <div class="signup-error" th:if="${signupError}" th:text="${signupError}"></div>

    <!-- 회원가입 폼 -->
    <form th:object="${signupForm}" th:action="@{/signup}" method="post" class="signup-form">

      <!-- 이름 -->
      <div class="form-group">
        <label class="form-label" for="name">이름 <span class="required">*</span></label>
        <input type="text" id="name" th:field="*{name}"
               class="form-input" placeholder="홍길동">
        <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <!-- 이메일 -->
      <div class="form-group">
        <label class="form-label" for="email">캠퍼스 웹메일 <span class="required">*</span></label>
        <input type="email" id="email" th:field="*{email}"
               class="form-input" placeholder="student@osan.ac.kr">
        <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <p class="form-hint">✓ 대학교 웹메일(@ac.kr)로만 가입 가능합니다</p>
      </div>

      <!-- 비밀번호 -->
      <div class="form-group">
        <label class="form-label" for="password">비밀번호 <span class="required">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password" th:field="*{password}"
                 class="form-input" placeholder="4자 이상 입력">
          <button type="button" class="eye-btn" onclick="togglePw('password')">👁</button>
        </div>
        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="form-group">
        <label class="form-label" for="passwordConfirm">비밀번호 확인 <span class="required">*</span></label>
        <div class="password-wrap">
          <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                 class="form-input" placeholder="비밀번호 다시 입력">
          <button type="button" class="eye-btn" onclick="togglePw('passwordConfirm')">👁</button>
        </div>
        <div class="form-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
      </div>

      <!-- 가입 버튼 -->
      <button type="submit" class="signup-btn">회원가입</button>

    </form>

    <!-- 로그인 링크 -->
    <p class="login-link">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" class="login-anchor">로그인</a>
    </p>

  </div>

</main>

<script>
  function togglePw(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>

</body>
</html>

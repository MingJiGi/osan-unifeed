<!DOCTYPE html>
<!-- 
  =============================================================================
  UNIFEED (유니피드) 회원가입 화면
  =============================================================================
  대학생 인증을 위한 학교 웹메일 인증, 닉네임, 비밀번호 설정 폼을 제공합니다.
  상단에 뒤로가기 헤더가 포함되어 있으며 하단 탭바는 노출되지 않습니다.
  모든 스타일은 app.css에 정의된 클래스를 사용하며 인라인 style이나 비표준 유틸리티 클래스를 사용하지 않습니다.
  =============================================================================
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 공통 <head> 조각을 불러오며 브라우저 탭 제목으로 '회원가입'을 전달합니다. -->
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>

<body>
    
    <!-- 1. 회원가입 전용 상단 헤더 (뒤로가기 버튼 + 페이지 타이틀) -->
    <header class="auth-nav-header">
        <!-- 뒤로가기 버튼: 브라우저 이전 히스토리로 돌아갑니다 -->
        <button type="button" onclick="history.back()" class="auth-back-btn" aria-label="뒤로가기">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
        <h1 class="auth-nav-title">회원가입</h1>
    </header>

    <!-- 2. 회원가입 입력 폼 컨테이너 -->
    <main class="auth-signup-container auth-desktop-card">
        
        <!-- 회원가입 폼 (서버의 /auth/signup 으로 POST 전송) -->
        <form th:action="@{/auth/signup}" method="post" class="auth-form">
            
            <!-- (1) 학교 웹메일 입력 영역 및 인증 발송 버튼 -->
            <div class="form-group">
                <label for="email" class="form-label">
                    학교 웹메일 <span class="text-danger">*</span>
                </label>
                <div class="input-with-btn">
                    <input type="email" id="email" name="email" class="form-input flex-1" 
                           placeholder="example@osan.ac.kr" required>
                    <button type="button" class="btn btn-primary whitespace-nowrap">
                        인증 발송
                    </button>
                </div>
                <!-- 유효성 검증 실패 시 에러 메시지 -->
                <p th:if="${#fields?.hasErrors('email')}" th:errors="*{email}" class="form-error">
                    잘못된 이메일 형식입니다.
                </p>
                <p class="form-help">학교 웹메일(@*.ac.kr)만 가입 가능합니다.</p>
            </div>

            <!-- (2) 인증번호 6자리 입력 영역 -->
            <div class="form-group">
                <label for="authCode" class="form-label">
                    인증번호 <span class="text-danger">*</span>
                </label>
                <input type="text" id="authCode" name="authCode" maxlength="6" class="form-input" 
                       placeholder="6자리 숫자 입력" required>
            </div>

            <!-- (3) 닉네임 입력 영역 -->
            <div class="form-group">
                <label for="nickname" class="form-label">
                    닉네임 <span class="text-danger">*</span>
                </label>
                <input type="text" id="nickname" name="nickname" class="form-input" 
                       placeholder="사용하실 닉네임을 입력하세요" required>
                <p th:if="${#fields?.hasErrors('nickname')}" th:errors="*{nickname}" class="form-error">
                    닉네임 오류가 발생했습니다.
                </p>
            </div>

            <!-- (4) 비밀번호 입력 영역 (눈 모양 토글 버튼 포함) -->
            <div class="form-group">
                <label for="password" class="form-label">
                    비밀번호 <span class="text-danger">*</span>
                </label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" 
                           placeholder="비밀번호 입력 (영문, 숫자 포함 8자 이상)" required>
                    <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="비밀번호 표시 전환">
                        👁️
                    </button>
                </div>
                <p th:if="${#fields?.hasErrors('password')}" th:errors="*{password}" class="form-error">
                    비밀번호 조건을 충족해주세요.
                </p>
            </div>

            <!-- (5) 비밀번호 확인 입력 영역 -->
            <div class="form-group">
                <label for="passwordConfirm" class="form-label">
                    비밀번호 확인 <span class="text-danger">*</span>
                </label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-input" 
                       placeholder="비밀번호를 다시 한번 입력하세요" required>
            </div>

            <!-- 회원가입 최종 제출 버튼 -->
            <button type="submit" class="btn btn-primary mt-4">
                가입하기
            </button>
        </form>
    </main>

    <!-- 비밀번호 숨김/보임 토글 스크립트 -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });
        }
    </script>
</body>
</html>

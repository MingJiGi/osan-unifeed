<!DOCTYPE html>
<!--
  회원가입 화면 (auth/signup.html)
  ----------------------------------------------------------------------------
  - th:object="${signupForm}" : SignupForm DTO 와 폼 연결
  - th:action="@{/signup}"   : POST /signup 으로 제출
  - signupError 가 있으면 에러 메시지 표시
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 회원가입')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/list.css(v='18')}">
  <link rel="stylesheet" th:href="@{/css/signup.css(v='6')}">
</head>

<body class="signup-body">

<!-- 메인 영역 (GNB 미노출 독립 뷰) -->
<main class="signup-main">

  <!-- 회원가입 카드 -->
  <div class="signup-card">

    <!-- 로고 -->
    <div class="signup-logo">
      <img th:src="@{/images/UNIFEED_LOGO.png}" alt="유니피드" class="signup-logo-img"
           onerror="this.style.display='none'">
    </div>

    <h2 class="signup-title">UNIFEED</h2>
    <p class="signup-subtitle">대학 웹메일로 가입하고 캠퍼스 맛집 정보를 공유하세요</p>

    <!-- 에러 메시지 -->
    <div class="signup-error" th:if="${signupError}" th:text="${signupError}"></div>

    <!-- 회원가입 폼 -->
    <form th:object="${signupForm}" th:action="@{/signup}" method="post" class="signup-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">

      <!-- 이름 -->
      <div class="form-group">
        <label class="form-label" for="name">이름 <span class="required">*</span></label>
        <input type="text" id="name" th:field="*{name}"
               class="form-input" placeholder="홍길동" autocomplete="name">
        <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <!-- 이메일 -->
      <div class="form-group">
        <label class="form-label" for="email">캠퍼스 웹메일 <span class="required">*</span></label>
        <input type="email" id="email" th:field="*{email}"
               class="form-input" placeholder="student@univ.ac.kr" autocomplete="email">
        <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <p class="form-hint">✓ 대학교 웹메일(@ac.kr)로만 가입 가능합니다</p>
      </div>

      <!-- 소속 대학교 -->
      <div class="form-group">
        <label class="form-label" for="universitySearchInput">소속 대학교 <span class="required">*</span></label>
        <input type="text" id="universitySearchInput" class="form-input" placeholder="학교 이름을 검색하세요"
               oninput="searchUniversity(this.value)" autocomplete="off">
        <div id="universitySearchResults" class="restaurant-tag-results"></div>
        <div id="universityChip" class="restaurant-tag-chip" style="display:none;">
          <span id="universityChipText">학교 이름</span>
          <button type="button" onclick="clearUniversity()" aria-label="선택 취소">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <input type="hidden" th:field="*{universityId}" id="universityId" required>
        <div class="form-error" th:if="${#fields.hasErrors('universityId')}" th:errors="*{universityId}"></div>
        <p class="form-hint">검색 결과에 학교가 없으면 아래에서 등록을 신청하실 수 있습니다.</p>

        <!-- 검색 결과가 없을 때만 열리는 학교 등록 신청 폼.
             소속 대학교는 필수값이라, 목록에 없는 학교 학생은 애초에 가입이 불가능했다.
             신청을 남기면 관리자가 확인 후 학교를 등록하고 안내 메일을 보낸다. -->
        <div id="univRequestPanel" class="univ-request-panel" style="display:none;">
          <p class="univ-request-title">등록되지 않은 대학교입니다</p>
          <p class="univ-request-desc">
            학교 등록을 신청해주시면 확인 후 등록해 드립니다.<br>
            등록이 완료되면 아래 이메일로 안내해 드려요.
          </p>

          <label class="univ-request-label" for="reqUnivName">대학교 이름 <span class="required">*</span></label>
          <input type="text" id="reqUnivName" class="form-input" maxlength="100" placeholder="예: 계명대학교">

          <label class="univ-request-label" for="reqUnivAddress">학교 주소 <span class="required">*</span></label>
          <input type="text" id="reqUnivAddress" class="form-input" maxlength="200"
                 placeholder="예: 대구 달서구 달구벌대로 1095">

          <p class="univ-request-email">
            안내받을 이메일 <strong id="reqUnivEmail">위에 입력한 이메일</strong>
          </p>

          <button type="button" id="reqUnivSubmitBtn" class="univ-request-btn" onclick="submitUniversityRequest()">
            학교 등록 신청하기
          </button>
          <p class="univ-request-result" id="reqUnivResult"></p>
        </div>
      </div>

      <!-- 비밀번호 -->
      <div class="form-group">
        <label class="form-label" for="password">비밀번호 <span class="required">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password" th:field="*{password}"
                 class="form-input" placeholder="8자 이상 입력" minlength="8" autocomplete="new-password">
          <button type="button" class="eye-btn" onclick="togglePw('password')" title="비밀번호 표시 전환" aria-label="비밀번호 표시 전환"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="form-group">
        <label class="form-label" for="passwordConfirm">비밀번호 확인 <span class="required">*</span></label>
        <div class="password-wrap">
          <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                 class="form-input" placeholder="비밀번호 다시 입력" autocomplete="new-password">
          <button type="button" class="eye-btn" onclick="togglePw('passwordConfirm')" title="비밀번호 표시 전환" aria-label="비밀번호 표시 전환"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="form-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
      </div>

      <!-- 가입 버튼 -->
      <button type="submit" class="signup-btn">회원가입</button>

    </form>

    <!-- 로그인 링크 -->
    <p class="login-link">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" class="login-anchor">로그인</a>
    </p>

  </div>

</main>

<script>
  function togglePw(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // 소속 대학교 검색 (맛집 태그 검색과 같은 패턴 — post-widgets.js 참고)
  let universitySearchTimer = null;
  function searchUniversity(keyword) {
    clearTimeout(universitySearchTimer);
    const resultsEl = document.getElementById('universitySearchResults');
    const kw = keyword.trim();
    if (!kw) {
      resultsEl.innerHTML = '';
      return;
    }
    universitySearchTimer = setTimeout(() => {
      fetch('/api/universities?keyword=' + encodeURIComponent(kw))
        .then(res => res.json())
        .then(list => renderUniversityResults(Array.isArray(list) ? list.slice(0, 6) : []))
        .catch(() => { resultsEl.innerHTML = ''; });
    }, 250);
  }

  function renderUniversityResults(list) {
    const resultsEl = document.getElementById('universitySearchResults');
    resultsEl.innerHTML = '';
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'restaurant-tag-empty';
      empty.textContent = '등록되지 않은 대학교입니다. 아래에서 등록을 신청해주세요.';
      resultsEl.appendChild(empty);
      openUniversityRequestPanel();
      return;
    }
    closeUniversityRequestPanel();
    list.forEach(u => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'restaurant-tag-item';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'restaurant-tag-item-name';
      nameSpan.textContent = u.name;
      btn.appendChild(nameSpan);
      btn.addEventListener('click', () => selectUniversity(u));
      resultsEl.appendChild(btn);
    });
  }

  function selectUniversity(u) {
    document.getElementById('universityId').value = u.id;
    document.getElementById('universitySearchInput').value = '';
    document.getElementById('universitySearchResults').innerHTML = '';
    document.getElementById('universityChipText').textContent = u.name;
    document.getElementById('universityChip').style.display = 'inline-flex';
    closeUniversityRequestPanel();
  }

  function clearUniversity() {
    document.getElementById('universityId').value = '';
    document.getElementById('universityChip').style.display = 'none';
  }

  // ==========================================================================
  // 학교 등록 신청 — 검색해도 없는 학교일 때만 열린다.
  // ==========================================================================
  function openUniversityRequestPanel() {
    const panel = document.getElementById('univRequestPanel');
    if (panel.style.display === 'block') return;
    panel.style.display = 'block';
    // 방금 검색한 이름을 학교명 칸에 미리 채워준다(다시 타이핑하지 않게).
    const typed = document.getElementById('universitySearchInput').value.trim();
    const nameInput = document.getElementById('reqUnivName');
    if (typed && !nameInput.value.trim()) nameInput.value = typed;
    syncRequestEmail();
  }

  function closeUniversityRequestPanel() {
    document.getElementById('univRequestPanel').style.display = 'none';
  }

  // 가입 폼의 이메일을 그대로 쓴다 — 따로 입력받으면 오타로 안내 메일을 못 받는다.
  function syncRequestEmail() {
    const email = document.getElementById('email').value.trim();
    const el = document.getElementById('reqUnivEmail');
    el.textContent = email || '위에 입력한 이메일';
  }

  function submitUniversityRequest() {
    const btn = document.getElementById('reqUnivSubmitBtn');
    const resultEl = document.getElementById('reqUnivResult');
    const universityName = document.getElementById('reqUnivName').value.trim();
    const address = document.getElementById('reqUnivAddress').value.trim();
    const email = document.getElementById('email').value.trim();

    resultEl.className = 'univ-request-result';
    if (!email) {
      resultEl.classList.add('is-error');
      resultEl.textContent = '위에서 학교 이메일을 먼저 입력해주세요.';
      return;
    }
    if (!universityName) {
      resultEl.classList.add('is-error');
      resultEl.textContent = '대학교 이름을 입력해주세요.';
      return;
    }
    if (!address) {
      resultEl.classList.add('is-error');
      resultEl.textContent = '학교 주소를 입력해주세요.';
      return;
    }

    btn.disabled = true;
    btn.textContent = '신청 중...';

    fetch('/api/universities/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ universityName: universityName, address: address, email: email })
    })
      .then(res => res.json().then(data => ({ ok: res.ok, data: data })))
      .then(({ ok, data }) => {
        resultEl.className = 'univ-request-result ' + (ok ? 'is-success' : 'is-error');
        resultEl.textContent = data.message || (ok ? '신청이 접수되었습니다.' : '신청하지 못했습니다.');
        if (ok) {
          // 접수 후에는 다시 누르지 못하게 막는다(같은 내용 중복 신청 방지).
          btn.style.display = 'none';
        }
      })
      .catch(() => {
        resultEl.className = 'univ-request-result is-error';
        resultEl.textContent = '네트워크 오류로 신청하지 못했습니다. 잠시 후 다시 시도해주세요.';
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = '학교 등록 신청하기';
      });
  }

  document.getElementById('email').addEventListener('input', syncRequestEmail);

  // 이메일 입력 후 포커스를 벗어나면 도메인으로 학교를 자동 추천 (직접 검색해서 바꿀 수도 있음)
  document.getElementById('email').addEventListener('blur', function () {
    const email = this.value.trim();
    if (!email.includes('@') || document.getElementById('universityId').value) return;
    fetch('/api/universities/suggest?email=' + encodeURIComponent(email))
      .then(res => res.json())
      .then(list => { if (list.length > 0) selectUniversity(list[0]); })
      .catch(() => {});
  });
</script>

</body>
</html>

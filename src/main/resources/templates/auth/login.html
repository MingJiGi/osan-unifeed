<!DOCTYPE html>
<!-- 
  =============================================================================
  UNIFEED (유니피드) 로그인 화면
  =============================================================================
  대학 웹메일 계정 기반의 로그인 폼을 제공합니다.
  로그인 화면은 하단 탭바가 없는 독립적인 화면이며, 가운데 정렬된 카드 레이아웃을 사용합니다.
  모든 스타일은 app.css에 정의된 클래스를 사용하며 인라인 style이나 비표준 유틸리티 클래스를 사용하지 않습니다.
  =============================================================================
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 공통 <head> 조각을 불러오며 브라우저 탭 제목으로 '로그인'을 전달합니다. -->
<head th:replace="~{fragments/layout :: head('로그인')}"></head>

<body class="auth-body">
    <!-- 화면 중앙에 배치되는 인증 카드 컨테이너 -->
    <main class="auth-container">
        
        <div class="auth-card auth-desktop-card">
            <!-- 로고 및 서비스 슬로건 영역 -->
            <div class="auth-header">
                <a th:href="@{/feed}" class="auth-logo">UNIFEED</a>
                <p class="auth-subtitle">대학가 맛집 정보의 새로운 기준</p>
            </div>

            <!-- 
              로그인 폼 
              th:action="@{/auth/login}"으로 POST 요청을 전송합니다.
            -->
            <form th:action="@{/auth/login}" method="post" class="auth-form">
                
                <!-- 1. 이메일 입력 그룹 -->
                <div class="form-group">
                    <label for="email" class="form-label">학교 웹메일</label>
                    <input type="email" id="email" name="email" class="form-input" 
                           placeholder="학교 웹메일 (example@osan.ac.kr)" required>
                    <p class="form-help">학교 웹메일(@*.ac.kr)로만 로그인 가능합니다.</p>
                </div>

                <!-- 2. 비밀번호 입력 그룹 (눈 모양 토글 버튼 포함) -->
                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-input" 
                               placeholder="비밀번호를 입력하세요" required>
                        <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="비밀번호 표시 전환">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- 3. 로그인 제출 버튼 -->
                <button type="submit" class="btn btn-primary">
                    로그인
                </button>
            </form>

            <!-- 회원가입 페이지 이동 링크 -->
            <div class="auth-footer">
                <span>계정이 없으신가요?</span>
                <a th:href="@{/auth/signup}" class="auth-link">회원가입</a>
            </div>
        </div>
        
    </main>

    <!-- 
      비밀번호 보기/숨기기 토글 스크립트:
      눈 모양 아이콘 클릭 시 type 속성을 password 와 text 간에 상호 전환합니다.
    -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<!--
  관리자 전용 회원 목록 화면
  ----------------------------------------------------------------------------
  admin/reports.html과 같은 admin.css 스타일/레이아웃 톤을 그대로 재사용한다.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 회원 관리')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/admin.css(v='9')}">
</head>
<body class="admin-body">

<!-- 공통 GNB 헤더 -->
<header th:replace="~{fragments/layout :: gnb('adminMembers')}"></header>

<div class="admin-container">
  <div class="admin-header">
    <div>
      <h1 class="admin-title">회원 관리</h1>
      <p class="admin-subtitle">회원 목록입니다. 이름/이메일 검색과 대학 필터를 쓸 수 있고, 이름을 누르면 상세 정보와 작성 글을 볼 수 있습니다.</p>
    </div>
  </div>

  <form class="admin-filter" th:action="@{/admin/members}" method="get" role="search">
    <input type="search" name="q" th:value="${q}" class="admin-filter-input" placeholder="이름 또는 이메일 검색" aria-label="이름 또는 이메일 검색">
    <select name="universityId" class="admin-filter-select" aria-label="대학 필터">
      <option value="">전체 대학</option>
      <option th:each="u : ${universities}" th:value="${u.id}" th:text="${u.name}"
              th:selected="${universityId != null and universityId == u.id}">오산대학교</option>
    </select>
    <button type="submit" class="admin-btn admin-btn-resolve">검색</button>
    <a th:href="@{/admin/members}" class="admin-btn admin-btn-dismiss">초기화</a>
  </form>
  <p class="admin-result-count">총 <strong th:text="${#lists.size(members)}">0</strong>명</p>

  <div th:if="${#lists.isEmpty(members)}" class="admin-empty"
       th:text="${!q.isEmpty() or universityId != null} ? '조건에 맞는 회원이 없습니다.' : '등록된 회원이 없습니다.'">
    등록된 회원이 없습니다.
  </div>

  <div class="admin-report-list" th:unless="${#lists.isEmpty(members)}">
    <div class="admin-report-card" th:each="m : ${members}">
      <div class="admin-report-top">
        <span class="admin-target-badge" th:text="${m.university != null ? m.university.name : '학교 미지정'}">오산대학교</span>
        <span class="admin-target-badge" th:if="${m.admin}" style="color:var(--c-indigo-600); background:var(--c-indigo-50);">관리자</span>
        <span class="admin-target-badge" th:if="${m.suspended}" style="color:var(--c-red-500); background:var(--c-red-50);">정지됨</span>
        <span class="admin-report-date" th:text="${#temporals.format(m.createdAt, 'yyyy.MM.dd')}">2026.01.01</span>
      </div>

      <p class="admin-report-preview">
        <a th:href="@{/admin/members/{id}(id=${m.id})}" th:text="${m.name}"
           style="color:inherit; text-decoration:none;">이름</a>
      </p>
      <p class="admin-report-detail" th:text="${m.email}">email@example.com</p>
    </div>
  </div>
</div>
</body>
</html>

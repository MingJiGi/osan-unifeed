<!DOCTYPE html>
<!--
  피드(커뮤니티) 화면
  데이터 흐름: FeedController -> model.addAttribute("posts", ...) -> ${posts}
  Post 엔티티 필드: id, title, content, author(name), createdAt
  사진/해시태그/좋아요/댓글 수는 더미로 채워두고 나중에 DB 연동 예정
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 커뮤니티')}"></th:block>
</head>

<body class="feed-body">

<!-- 공통 GNB 헤더 -->
<header th:replace="~{fragments/layout :: gnb('posts')}"></header>

<!-- 메인 컨텐츠 -->
<main class="feed-container">

  <!-- 필터 칩 -->
  <div class="chip-row">
    <button class="chip chip-active">전체</button>
    <button class="chip">🔥 인기</button>
    <button class="chip">맛집추천</button>
    <button class="chip">가성비</button>
    <button class="chip">카페/카공</button>
    <button class="chip">학식후기</button>
  </div>

  <!-- 글 없을 때 -->
  <p class="feed-empty" th:if="${posts == null or posts.isEmpty()}">
    아직 게시글이 없습니다. 첫 번째 맛집 리뷰를 남겨보세요! 🍜
  </p>

  <!-- 카드 그리드 -->
  <div class="feed-grid" th:unless="${posts == null or posts.isEmpty()}">
    <div class="feed-card" th:each="post : ${posts}">

      <!-- 작성자 -->
      <div class="card-author">
        <img th:src="@{/images/avatar.jpg}" alt="프로필" class="author-avatar">
        <div class="author-info">
          <span class="author-name" th:text="${post.author.name}">작성자</span>
          <span class="author-meta">
            <span th:text="${#temporals.format(post.createdAt, 'MM/dd HH:mm')}">00/00</span>
          </span>
        </div>
      </div>

      <!-- 음식 사진 (더미 - 나중에 post.imageUrl 로 교체) -->
      <div class="card-img-wrap">
        <img th:src="@{/images/food1.jpg}" alt="음식 사진" class="card-img">
      </div>

      <!-- 카드 바디 -->
      <div class="card-body">
        <h3 class="card-title" th:text="${post.title}">제목</h3>
        <p class="card-content" th:text="${post.content}">본문</p>
        <!-- 해시태그 더미 (나중에 post.tags 로 교체) -->
        <p class="card-tags">#오산대맛집 #가성비 #맛집추천</p>
        <div class="card-footer">
          <div class="card-reactions">
            <span class="reaction">❤️ 0</span>
            <span class="reaction">💬 0</span>
          </div>
          <span class="card-save">📌 저장</span>
        </div>
      </div>

    </div>
  </div>

</main>

<!-- FAB -->
<a th:href="@{/posts/new}" class="fab">✏️ 새 글 작성</a>

</body>
</html>

<!DOCTYPE html>
<!--
  시간표 & 학점계산기 화면 (timetable/index.html)
  - 09:00 ~ 22:00 정밀 5분 단위 수업 시간 배치
  - GNB 라인 SVG 디자인 일치
  - 심플 학기 선택 및 직접 입력
  - 학점 계산기 (더미데이터 제거 및 실시간 계산)
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout :: head('유니피드 - 시간표 & 학점계산기')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/timetable.css(v='8')}">
</head>

<body class="timetable-body">

<!-- 공통 GNB 헤더 -->
<header th:replace="~{fragments/layout :: gnb('timetable')}"></header>

<main class="timetable-page-container">

  <!-- ================= 1. 주간 시간표 카드 (09:00 ~ 22:00 정밀 5분 배치) ================= -->
  <section class="timetable-card">
    <div class="timetable-header">
      <div class="timetable-title-group">
        <div class="semester-header-row">
          <!-- navbar와 완벽히 통일된 라인 달력 아이콘 -->
          <span class="title-icon-svg">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>

          <h1 class="timetable-title">내 시간표</h1>

          <!-- 동그란 오렌지 배경 없이 자연스러운 학기 선택/입력 인터페이스 -->
          <div class="semester-selector-box">
            <input type="text" id="semesterInput" class="semester-input" value="2026학년도 1학기"
                   placeholder="학기명 입력" title="클릭하여 직접 학기명을 입력할 수 있습니다"
                   oninput="onSemesterCustomInput()" onblur="onSemesterInputBlur()">
            <select id="semesterSelect" class="semester-select" onchange="onSemesterSelectChange()">
              <option value="2026학년도 1학기">2026학년도 1학기</option>
              <option value="2026학년도 여름학기">2026학년도 여름학기</option>
              <option value="2026학년도 2학기">2026학년도 2학기</option>
              <option value="2026학년도 겨울학기">2026학년도 겨울학기</option>
              <option value="2025학년도 2학기">2025학년도 2학기</option>
              <option value="2025학년도 1학기">2025학년도 1학기</option>
              <option value="custom">✏️ 직접 입력</option>
            </select>
          </div>
        </div>
        <p class="timetable-subtitle" id="timetableSubtitle">등록된 수업 <span id="courseCount">0</span>개 · 시간표를 자유롭게 구성해보세요.</p>
      </div>

      <div class="header-actions">
        <!-- 시간표 사진 인식 — GEMINI_API_KEY 가 없는 환경에서는 렌더링되지 않는다. -->
        <input type="file" id="ocrFileInput" accept="image/png,image/jpeg,image/webp" hidden
               th:if="${ocrEnabled}" onchange="handleOcrFileSelect(event)">
        <button type="button" class="btn-ocr-action" id="ocrTriggerBtn" th:if="${ocrEnabled}"
                onclick="document.getElementById('ocrFileInput').click()"
                title="에브리타임 캡처 등 시간표 사진을 올리면 수업을 자동으로 읽어옵니다">
          <span class="ocr-badge">AI</span> 사진으로 불러오기
        </button>
        <button type="button" class="btn-outline-action" onclick="clearAllCourses()">시간표 비우기</button>
        <button type="button" class="btn-add-course" onclick="openAddModal()">
          <span>+</span> 수업 추가
        </button>
      </div>
    </div>

    <!-- 09:00 ~ 22:00 정밀 5분 단위 그리드 테이블 -->
    <div class="timetable-grid-wrap">
      <!-- 1. 요일 헤더 행 -->
      <div class="timetable-header-row">
        <div class="grid-head-cell">시간</div>
        <div class="grid-head-cell" id="headDay-2">월요일</div>
        <div class="grid-head-cell" id="headDay-3">화요일</div>
        <div class="grid-head-cell" id="headDay-4">수요일</div>
        <div class="grid-head-cell" id="headDay-5">목요일</div>
        <div class="grid-head-cell" id="headDay-6">금요일</div>
      </div>

      <!-- 2. 시간표 본체 (시간열 + 월~금 5개 컬럼) -->
      <div class="timetable-body-wrap">
        <!-- 시간 열 (09:00 ~ 21:00, 각 60px) -->
        <div class="time-col" id="timeLabelCol">
          <!-- JS에서 09:00 ~ 21:00 라벨 생성 -->
        </div>

        <!-- 월요일 컬럼 (col 2) -->
        <div class="day-column" id="dayCol-2"></div>
        <!-- 화요일 컬럼 (col 3) -->
        <div class="day-column" id="dayCol-3"></div>
        <!-- 수요일 컬럼 (col 4) -->
        <div class="day-column" id="dayCol-4"></div>
        <!-- 목요일 컬럼 (col 5) -->
        <div class="day-column" id="dayCol-5"></div>
        <!-- 금요일 컬럼 (col 6) -->
        <div class="day-column" id="dayCol-6"></div>
      </div>
    </div>
  </section>

  <!-- ================= 2. 학점 계산기 카드 (GPA Calculator) ================= -->
  <section class="timetable-card">
    <div class="timetable-header">
      <div class="timetable-title-group">
        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- navbar 라인 디자인과 일치하는 학사모 SVG 아이콘 -->
          <span class="title-icon-svg">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </span>
          <h2 class="timetable-title">학점 계산기</h2>
        </div>
        <p class="timetable-subtitle">과목별 성적을 입력하면 실시간으로 이번 학기 평점과 이수학점을 자동 계산합니다.</p>
      </div>

      <div class="header-actions">
        <select class="gpa-select" id="gpaScale" onchange="calculateGPA()">
          <option value="4.5">4.5 만점 기준</option>
          <option value="4.3">4.3 만점 기준</option>
        </select>
        <button type="button" class="btn-outline-action" onclick="syncFromTimetable()">시간표 과목 불러오기</button>
      </div>
    </div>

    <!-- 평점 요약 대시보드 -->
    <div class="gpa-summary-board">
      <div class="gpa-stat-card primary">
        <span class="gpa-stat-label">전체 평점 (GPA)</span>
        <div class="gpa-stat-value">
          <span id="statTotalGpa">0.00</span>
          <span class="gpa-stat-sub" id="statScaleLabel">/ 4.5</span>
        </div>
      </div>
      <div class="gpa-stat-card secondary">
        <span class="gpa-stat-label">전공 평점</span>
        <div class="gpa-stat-value">
          <span id="statMajorGpa">0.00</span>
          <span class="gpa-stat-sub">/ 4.5</span>
        </div>
      </div>
      <div class="gpa-stat-card">
        <span class="gpa-stat-label">총 취득학점</span>
        <div class="gpa-stat-value">
          <span id="statTotalCredits">0</span>
          <span class="gpa-stat-sub">학점</span>
        </div>
      </div>
      <div class="gpa-stat-card">
        <span class="gpa-stat-label">전공 취득학점</span>
        <div class="gpa-stat-value">
          <span id="statMajorCredits">0</span>
          <span class="gpa-stat-sub">학점</span>
        </div>
      </div>
    </div>

    <!-- 성적 입력 테이블 (더미데이터 없음) -->
    <div class="gpa-table-wrap">
      <table class="gpa-table">
        <thead>
          <tr>
            <th style="width: 35%;">과목명</th>
            <th style="width: 18%;">학점</th>
            <th style="width: 22%;">성적</th>
            <th style="width: 15%;">전공 여부</th>
            <th style="width: 10%; text-align: center;">삭제</th>
          </tr>
        </thead>
        <tbody id="gpaTableBody">
          <!-- 사용자가 직접 추가하거나 시간표에서 불러옵니다 -->
        </tbody>
      </table>
    </div>

    <div class="gpa-actions-bar">
      <button type="button" class="btn-add-row" onclick="addGpaRow()">
        <span>+</span> 과목 추가하기
      </button>
      <div class="gpa-right-actions">
        <button type="button" class="btn-calc-action" onclick="resetGpaRows()">초기화</button>
        <button type="button" class="btn-calc-action" onclick="saveGpaData()">학점 저장</button>
      </div>
    </div>
  </section>

</main>

<!-- ================= 시간표 사진 인식 결과 확인 모달 =================
     AI가 읽은 결과를 바로 저장하지 않고 먼저 보여준다. 잘못 읽은 줄은 체크를 풀면 저장되지 않는다. -->
<div class="modal-overlay" id="ocrResultModal">
  <div class="modal-box">
    <div class="modal-title">
      <span>사진에서 읽은 수업</span>
      <button type="button" class="modal-close-btn" onclick="closeOcrModal()" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <p class="ocr-modal-desc" id="ocrResultDesc">읽는 중...</p>
    <div class="ocr-result-list" id="ocrResultList"></div>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeOcrModal()">취소</button>
      <button type="button" class="btn-submit" id="ocrConfirmBtn" onclick="confirmOcrCourses()">시간표에 추가</button>
    </div>
  </div>
</div>

<!-- ================= 5분 단위 수업 추가 모달 ================= -->
<div class="modal-overlay" id="addCourseModal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modalTitleText">새 수업 추가</span>
      <button type="button" class="modal-close-btn" onclick="closeAddModal()" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <form id="addCourseForm" onsubmit="handleCourseSubmit(event)">
      <div class="modal-form-group">
        <label class="modal-label">과목명 *</label>
        <input type="text" id="mCourseName" class="modal-input" placeholder="예: 웹 프로그래밍 실무" required autocomplete="off">
      </div>

      <div class="modal-form-group">
        <label class="modal-label">교수명 및 강의실</label>
        <input type="text" id="mCourseInfo" class="modal-input" placeholder="예: 김교수 · IT관 401호" autocomplete="off">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="modal-form-group">
          <label class="modal-label">요일 *</label>
          <select id="mDay" class="modal-select">
            <option value="2">월요일</option>
            <option value="3">화요일</option>
            <option value="4">수요일</option>
            <option value="5">목요일</option>
            <option value="6">금요일</option>
          </select>
        </div>
        <div class="modal-form-group">
          <label class="modal-label">색상 테마</label>
          <select id="mColor" class="modal-select">
            <option value="course-pink">핑크</option>
            <option value="course-mint">민트</option>
            <option value="course-blue">블루</option>
            <option value="course-orange">오렌지</option>
            <option value="course-purple">퍼플</option>
          </select>
        </div>
      </div>

      <!-- 5분 단위 시작 시간 (시 / 분) -->
      <div class="modal-form-group">
        <label class="modal-label">시작 시간 (5분 단위) *</label>
        <div class="time-select-dual">
          <select id="mStartHour" class="modal-select" onchange="validateTimes()">
            <!-- 09 ~ 21시 -->
          </select>
          <select id="mStartMinute" class="modal-select" onchange="validateTimes()">
            <!-- 00 ~ 55분 (5분 단위) -->
          </select>
        </div>
      </div>

      <!-- 5분 단위 종료 시간 (시 / 분) -->
      <div class="modal-form-group">
        <label class="modal-label">종료 시간 (5분 단위) *</label>
        <div class="time-select-dual">
          <select id="mEndHour" class="modal-select" onchange="validateTimes()">
            <!-- 09 ~ 22시 -->
          </select>
          <select id="mEndMinute" class="modal-select" onchange="validateTimes()">
            <!-- 00 ~ 55분 (5분 단위) -->
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeAddModal()">취소</button>
        <button type="submit" class="btn-submit" id="modalSubmitBtn">시간표에 등록</button>
      </div>
    </form>
  </div>
</div>

<script>
  /* ==========================================================================
     1. 시간표 정밀 5분 배치 로직 (09:00 ~ 22:00)
     ========================================================================== */
  const START_HOUR = 9;   // 09:00
  const END_HOUR = 22;    // 22:00
  const HOUR_HEIGHT = 60; // 1시간당 높이 60px (1분당 정확히 1.0px, 5분당 5px)
  let courses = [];
  let editingCourseId = null; // null이면 새 수업 추가 모드, 값이 있으면 그 수업 수정 모드

  // 초기화: 시간 라벨 및 요일별 수평 그리드선 생성
  function initTimetableGrid() {
    const timeCol = document.getElementById('timeLabelCol');
    timeCol.innerHTML = '';

    // 시간 라벨 (09:00 ~ 21:00 13개)
    for (let h = START_HOUR; h < END_HOUR; h++) {
      const slot = document.createElement('div');
      slot.className = 'time-label-slot';
      slot.id = 'timeSlot-' + h;
      slot.textContent = String(h).padStart(2, '0') + ':00';
      timeCol.appendChild(slot);
    }

    // 요일 컬럼 (2=월, 3=화, 4=수, 5=목, 6=금) 내부에 13개 가로 그리드선 배경 깔기
    for (let col = 2; col <= 6; col++) {
      const dayEl = document.getElementById('dayCol-' + col);
      dayEl.innerHTML = '';
      for (let h = START_HOUR; h < END_HOUR; h++) {
        const slot = document.createElement('div');
        slot.className = 'day-grid-slot';
        dayEl.appendChild(slot);
      }
    }

    // 모달 5분 단위 시/분 셀렉트 생성
    setupTimeSelects();

    // 서버에 저장된 시간표 불러오기 (더미데이터 없음)
    loadCoursesFromServer();
  }

  // 5분 단위 셀렉트박스 옵션 채우기
  function setupTimeSelects() {
    const startHourSelect = document.getElementById('mStartHour');
    const endHourSelect = document.getElementById('mEndHour');
    const startMinSelect = document.getElementById('mStartMinute');
    const endMinSelect = document.getElementById('mEndMinute');

    startHourSelect.innerHTML = '';
    endHourSelect.innerHTML = '';
    startMinSelect.innerHTML = '';
    endMinSelect.innerHTML = '';

    // 시간 (시)
    for (let h = START_HOUR; h < END_HOUR; h++) {
      const hStr = String(h).padStart(2, '0');
      startHourSelect.appendChild(new Option(`${hStr}시`, h));
    }
    for (let h = START_HOUR; h <= END_HOUR; h++) {
      const hStr = String(h).padStart(2, '0');
      endHourSelect.appendChild(new Option(`${hStr}시`, h));
    }

    // 5분 단위 (분: 00, 05, 10, ... 55)
    for (let m = 0; m < 60; m += 5) {
      const mStr = String(m).padStart(2, '0');
      startMinSelect.appendChild(new Option(`${mStr}분`, m));
      endMinSelect.appendChild(new Option(`${mStr}분`, m));
    }

    // 기본값 설정 (09:00 ~ 10:15 등)
    startHourSelect.value = 9;
    startMinSelect.value = 0;
    endHourSelect.value = 10;
    endMinSelect.value = 15;

    // 종료 시(hour)가 그리드 마지막 시각(22시)이면 분(minute)은 00으로 고정 — 안 그러면
    // "22시 45분" 같은, 09:00~22:00 그리드 밖으로 삐져나가는 값을 그대로 고를 수 있었다.
    endHourSelect.addEventListener('change', restrictEndMinuteAtDayEnd);
    restrictEndMinuteAtDayEnd();
  }

  function restrictEndMinuteAtDayEnd() {
    const endHourSelect = document.getElementById('mEndHour');
    const endMinSelect = document.getElementById('mEndMinute');
    if (parseInt(endHourSelect.value, 10) === END_HOUR) {
      endMinSelect.value = 0;
      endMinSelect.disabled = true;
    } else {
      endMinSelect.disabled = false;
    }
  }

  function validateTimes() {
    const sH = parseInt(document.getElementById('mStartHour').value, 10);
    const sM = parseInt(document.getElementById('mStartMinute').value, 10);
    const eH = parseInt(document.getElementById('mEndHour').value, 10);
    const eM = parseInt(document.getElementById('mEndMinute').value, 10);

    const startTotal = sH * 60 + sM;
    const endTotal = eH * 60 + eM;

    if (endTotal <= startTotal) {
      // 종료 시간이 시작 시간보다 빠르면 시작 시간 + 60분으로 자동 보정(단, 그리드 끝(22:00)은 넘지 않는다)
      const newEnd = Math.min(startTotal + 60, END_HOUR * 60);
      const newEndH = Math.floor(newEnd / 60);
      const newEndM = newEnd % 60;
      document.getElementById('mEndHour').value = newEndH;
      document.getElementById('mEndMinute').value = Math.floor(newEndM / 5) * 5;
      restrictEndMinuteAtDayEnd();
    }
  }

  // 시간표 렌더링 (5분 단위 absolute 위치 계산)
  // 시간표 렌더링 (5분 단위 absolute 위치 계산 & 스프링 팝 순차 등장)
  function renderCourses() {
    // 기존 수업 블록 제거
    document.querySelectorAll('.course-block').forEach(el => el.remove());
    document.getElementById('courseCount').textContent = courses.length;

    courses.forEach((c, idx) => {
      const dayEl = document.getElementById('dayCol-' + c.dayCol);
      if (!dayEl) return;

      const startTotalMin = (c.startHour * 60 + c.startMin) - (START_HOUR * 60);
      const durationMin = (c.endHour * 60 + c.endMin) - (c.startHour * 60 + c.startMin);

      // 1시간 = 60분 = 60px -> 1분 = 1.0px
      const topPx = (startTotalMin / 60) * HOUR_HEIGHT;
      // 50분 등 짧은 수업도 텍스트가 찌그러지지 않도록 최소 48px 높이 보장
      const calculatedHeight = (durationMin / 60) * HOUR_HEIGHT - 3;
      const heightPx = Math.max(48, calculatedHeight);

      const sTimeStr = `${String(c.startHour).padStart(2,'0')}:${String(c.startMin).padStart(2,'0')}`;
      const eTimeStr = `${String(c.endHour).padStart(2,'0')}:${String(c.endMin).padStart(2,'0')}`;

      const block = document.createElement('div');
      block.className = 'course-block ' + c.color;
      if (durationMin <= 50) {
        block.classList.add('compact-course');
      }
      if (durationMin < 40) {
        block.classList.add('mini-course');
      }
      block.style.top = topPx + 'px';
      block.style.height = heightPx + 'px';
      // 순차 등장 시차 (Staggered spring pop)
      block.style.animationDelay = (idx * 0.06) + 's';

      const infoHtml = (c.info && c.info.trim()) ? `<span class="course-info" title="${escapeHtml(c.info)}">${escapeHtml(c.info)}</span>` : '';

      block.innerHTML = `
        <button type="button" class="btn-del-course" title="수업 삭제" onclick="deleteCourse('${c.id}', event)"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <span class="course-name" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</span>
        ${infoHtml}
        <span class="course-time">${sTimeStr} ~ ${eTimeStr}</span>
      `;

      // 가이드 룰러 하이라이트 이벤트 리스너
      block.addEventListener('mouseenter', () => highlightScheduleGuide(c.dayCol, c.startHour, c.endHour));
      block.addEventListener('mouseleave', () => clearScheduleGuide());
      // 카드 클릭 -> 수정 모달 (삭제 버튼 클릭은 stopPropagation 되어 있어서 여기로 안 옴)
      block.addEventListener('click', () => openEditModal(c));

      dayEl.appendChild(block);
    });
  }

  // 가이드 룰러: 마우스 올린 수업의 요일과 시간대 헤더 하이라이트
  function highlightScheduleGuide(dayCol, startHour, endHour) {
    clearScheduleGuide();
    const dayHead = document.getElementById('headDay-' + dayCol);
    if (dayHead) dayHead.classList.add('highlight-day');

    for (let h = startHour; h <= Math.min(END_HOUR - 1, endHour); h++) {
      const slot = document.getElementById('timeSlot-' + h);
      if (slot) slot.classList.add('highlight-time');
    }
  }

  function clearScheduleGuide() {
    document.querySelectorAll('.grid-head-cell.highlight-day').forEach(el => el.classList.remove('highlight-day'));
    document.querySelectorAll('.time-label-slot.highlight-time').forEach(el => el.classList.remove('highlight-time'));
  }

  function handleCourseSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('mCourseName').value.trim();
    const info = document.getElementById('mCourseInfo').value.trim();
    const dayCol = parseInt(document.getElementById('mDay').value, 10);
    const color = document.getElementById('mColor').value;
    const startHour = parseInt(document.getElementById('mStartHour').value, 10);
    const startMin = parseInt(document.getElementById('mStartMinute').value, 10);
    const endHour = parseInt(document.getElementById('mEndHour').value, 10);
    const endMin = parseInt(document.getElementById('mEndMinute').value, 10);
    const semester = document.getElementById('semesterInput').value.trim();

    const isEdit = editingCourseId !== null;
    const url = isEdit ? '/api/timetable/courses/' + editingCourseId : '/api/timetable/courses';
    const submitBtn = document.getElementById('modalSubmitBtn');
    setButtonLoading(submitBtn, true, isEdit ? '수정 중...' : '등록 중...');

    fetch(url, {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ semester, name, info, dayCol, color, startHour, startMin, endHour, endMin })
    })
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        setButtonLoading(submitBtn, false);
        if (!ok) {
          showToast(data.message || (isEdit ? '수업을 수정하지 못했습니다.' : '수업을 추가하지 못했습니다.'), 'error');
          return;
        }
        if (isEdit) {
          const idx = courses.findIndex(c => String(c.id) === String(editingCourseId));
          if (idx !== -1) courses[idx] = data;
        } else {
          courses.push(data);
        }
        // 직접 입력한 학기에 첫 수업을 넣었으면, 그 학기를 드롭다운에 바로 올려서
        // 다음부터는 타이핑하지 않고 목록에서 고를 수 있게 한다.
        addSemesterOption(data.semester);
        syncSemesterSelectToInput();

        showToast(isEdit ? '수업이 수정되었습니다.' : '시간표에 등록되었습니다.', 'success');
        renderCourses();
        closeAddModal();
        document.getElementById('addCourseForm').reset();
        setupTimeSelects();
      })
      .catch(() => {
        setButtonLoading(submitBtn, false);
        showToast('네트워크 오류로 ' + (isEdit ? '수업을 수정하지' : '수업을 추가하지') + ' 못했습니다.', 'error');
      });
  }

  function deleteCourse(id, e) {
    e.stopPropagation();
    if (confirm('이 수업을 시간표에서 삭제할까요?')) {
      const btn = e.target;
      const block = btn.closest('.course-block');

      const finishDelete = () => {
        fetch('/api/timetable/courses/' + id, { method: 'DELETE' })
          .then(res => res.json().then(data => ({ ok: res.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) {
              showToast(data.message || '수업을 삭제하지 못했습니다.', 'error');
              return;
            }
            courses = courses.filter(c => String(c.id) !== String(id));
            renderCourses();
            clearScheduleGuide();
          })
          .catch(() => showToast('네트워크 오류로 수업을 삭제하지 못했습니다.', 'error'));
      };

      if (block) {
        block.style.transition = 'all 0.22s cubic-bezier(0.4, 0, 0.2, 1)';
        block.style.transform = 'scale(0.8) translateY(8px)';
        block.style.opacity = '0';
        setTimeout(finishDelete, 200);
      } else {
        finishDelete();
      }
    }
  }

  function clearAllCourses() {
    // 화면이 한 학기만 보여주므로, 비우기도 "지금 보고 있는 학기"만 지운다(다른 학기 시간표는 그대로).
    const semester = document.getElementById('semesterInput').value.trim();
    if (confirm('[' + semester + '] 시간표의 수업을 모두 비우시겠습니까?\n다른 학기 시간표는 그대로 유지됩니다.')) {
      fetch('/api/timetable/courses?semester=' + encodeURIComponent(semester), { method: 'DELETE' })
        .then(res => {
          if (!res.ok) throw new Error('clear failed');
          courses = [];
          renderCourses();
        })
        .catch(() => showToast('네트워크 오류로 시간표를 비우지 못했습니다.', 'error'));
    }
  }

  function loadCoursesFromServer() {
    // 지금 선택/입력된 학기 것만 불러온다 — semesterInput이 아직 안 만들어진 시점(이론상 없음)을
    // 대비해 안전하게 빈 문자열로 폴백.
    const semester = document.getElementById('semesterInput') ? document.getElementById('semesterInput').value.trim() : '';
    fetch('/api/timetable/courses?semester=' + encodeURIComponent(semester))
      .then(res => {
        if (!res.ok) throw new Error('시간표를 불러오지 못했습니다.');
        return res.json();
      })
      .then(data => {
        courses = Array.isArray(data) ? data : [];
        renderCourses();
      })
      .catch(() => {
        courses = [];
        renderCourses();
        showToast('시간표를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.', 'error');
      });
  }

  // ==========================================================================
  // 시간표 사진 인식 (AI)
  // --------------------------------------------------------------------------
  // 사진을 서버로 보내면 수업 목록만 돌려받는다(저장은 안 됨). 그 목록을 모달에 보여주고,
  // 사용자가 체크한 것만 기존 "수업 추가" API로 하나씩 저장한다.
  // 잘못 읽은 수업이 묻지도 않고 시간표에 들어가지 않게 하는 게 이 2단계의 목적.
  // ==========================================================================
  const OCR_COLORS = ['course-pink', 'course-mint', 'course-blue', 'course-orange', 'course-purple'];
  const DAY_LABELS = { 2: '월', 3: '화', 4: '수', 5: '목', 6: '금' };
  let ocrParsedCourses = [];
  let ocrBusy = false;

  function pad2(n) { return String(n).padStart(2, '0'); }

  function handleOcrFileSelect(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // 같은 파일을 다시 골라도 change 가 뜨도록 비워둔다
    if (!file || ocrBusy) return;

    const btn = document.getElementById('ocrTriggerBtn');
    ocrBusy = true;
    setButtonLoading(btn, true, '읽는 중...');

    ocrParsedCourses = [];
    document.getElementById('ocrResultList').innerHTML = '';
    document.getElementById('ocrResultDesc').textContent = 'AI가 시간표 사진을 읽고 있어요... (10초 정도 걸립니다)';
    document.getElementById('ocrConfirmBtn').disabled = true;
    document.getElementById('ocrResultModal').classList.add('active');

    const formData = new FormData();
    formData.append('file', file);

    // multipart 요청은 CSRF 토큰이 필요하다(JSON 요청만 면제).
    fetch(window.csrfParam('/api/timetable/courses/from-image'), { method: 'POST', body: formData })
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) {
          document.getElementById('ocrResultDesc').textContent = data.message || '사진을 읽지 못했습니다.';
          return;
        }
        ocrParsedCourses = data.courses || [];
        document.getElementById('ocrResultDesc').textContent = data.message || '';
        renderOcrResults();
      })
      .catch(() => {
        document.getElementById('ocrResultDesc').textContent = '네트워크 오류로 사진을 읽지 못했습니다.';
      })
      .finally(() => {
        ocrBusy = false;
        setButtonLoading(btn, false);
      });
  }

  function renderOcrResults() {
    const list = document.getElementById('ocrResultList');
    const confirmBtn = document.getElementById('ocrConfirmBtn');
    if (!ocrParsedCourses.length) {
      list.innerHTML = '';
      confirmBtn.disabled = true;
      return;
    }
    confirmBtn.disabled = false;
    const semester = document.getElementById('semesterInput').value.trim();
    list.innerHTML = `<p class="ocr-target-semester">[${escapeHtml(semester)}] 시간표에 추가됩니다. 잘못 읽은 수업은 체크를 풀어주세요.</p>` +
      ocrParsedCourses.map((c, i) => `
        <label class="ocr-result-item">
          <input type="checkbox" checked data-ocr-idx="${i}">
          <span class="ocr-item-day">${DAY_LABELS[c.dayCol] || '?'}</span>
          <span class="ocr-item-body">
            <span class="ocr-item-name">${escapeHtml(c.name)}</span>
            <span class="ocr-item-meta">${pad2(c.startHour)}:${pad2(c.startMin)} ~ ${pad2(c.endHour)}:${pad2(c.endMin)}${c.info ? ' · ' + escapeHtml(c.info) : ''}</span>
          </span>
        </label>
      `).join('');
  }

  function closeOcrModal() {
    document.getElementById('ocrResultModal').classList.remove('active');
  }

  function confirmOcrCourses() {
    const picked = Array.from(document.querySelectorAll('#ocrResultList input[type=checkbox]:checked'))
      .map(el => ocrParsedCourses[parseInt(el.dataset.ocrIdx, 10)])
      .filter(Boolean);
    if (!picked.length) {
      showToast('추가할 수업을 선택해주세요.', 'error');
      return;
    }

    const semester = document.getElementById('semesterInput').value.trim();
    const confirmBtn = document.getElementById('ocrConfirmBtn');
    setButtonLoading(confirmBtn, true, '추가 중...');

    // 기존 수업 추가 API를 그대로 쓴다 — 저장 검증(요일/시간 범위)이 한 곳에만 있게 된다.
    const requests = picked.map((c, i) => fetch('/api/timetable/courses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        semester: semester, name: c.name, info: c.info, dayCol: c.dayCol,
        color: OCR_COLORS[i % OCR_COLORS.length],
        startHour: c.startHour, startMin: c.startMin, endHour: c.endHour, endMin: c.endMin
      })
    }).then(res => (res.ok ? res.json() : null)).catch(() => null));

    Promise.all(requests).then(results => {
      setButtonLoading(confirmBtn, false);
      const added = results.filter(Boolean);
      added.forEach(course => courses.push(course));
      if (added.length) {
        addSemesterOption(added[0].semester);
        syncSemesterSelectToInput();
        renderCourses();
      }
      closeOcrModal();
      const failed = results.length - added.length;
      showToast(added.length + '개 수업을 추가했습니다.' + (failed > 0 ? ' (' + failed + '개 실패)' : ''),
                failed > 0 ? 'error' : 'success');
    });
  }

  function openAddModal() {
    editingCourseId = null;
    document.getElementById('modalTitleText').textContent = '새 수업 추가';
    document.getElementById('modalSubmitBtn').textContent = '시간표에 등록';
    document.getElementById('addCourseModal').classList.add('active');
    document.getElementById('mCourseName').focus();
  }

  // 시간표 카드 클릭 -> 기존 값 채워서 수정 모달 열기
  function openEditModal(course) {
    editingCourseId = course.id;
    document.getElementById('modalTitleText').textContent = '수업 수정';
    document.getElementById('modalSubmitBtn').textContent = '수정 저장';

    document.getElementById('mCourseName').value = course.name;
    document.getElementById('mCourseInfo').value = course.info || '';
    document.getElementById('mDay').value = course.dayCol;
    document.getElementById('mColor').value = course.color;
    document.getElementById('mStartHour').value = course.startHour;
    document.getElementById('mStartMinute').value = course.startMin;
    document.getElementById('mEndHour').value = course.endHour;
    document.getElementById('mEndMinute').value = course.endMin;
    restrictEndMinuteAtDayEnd();

    document.getElementById('addCourseModal').classList.add('active');
  }

  function closeAddModal() {
    document.getElementById('addCourseModal').classList.remove('active');
    editingCourseId = null;
    document.getElementById('modalTitleText').textContent = '새 수업 추가';
    document.getElementById('modalSubmitBtn').textContent = '시간표에 등록';
  }

  /* ==========================================================================
     학기 관리 로직 (심플 드롭다운 & 직접 입력)
     ========================================================================== */
  function loadSemester() {
    const savedSemester = localStorage.getItem('unifeed_timetable_semester');
    if (savedSemester) {
      document.getElementById('semesterInput').value = savedSemester;
      syncSemesterSelectToInput();
    }
  }

  // 입력칸에 적힌 학기명이 드롭다운에 있으면 그걸 선택 상태로, 없으면 '직접 입력'으로 표시한다.
  function syncSemesterSelectToInput() {
    const select = document.getElementById('semesterSelect');
    const value = document.getElementById('semesterInput').value.trim();
    const found = Array.from(select.options).some(o => o.value === value);
    select.value = found ? value : 'custom';
  }

  // 드롭다운에 학기 하나를 끼워 넣는다('✏️ 직접 입력' 바로 위에). 이미 있으면 아무것도 안 한다.
  function addSemesterOption(semester) {
    if (!semester) return;
    const select = document.getElementById('semesterSelect');
    if (Array.from(select.options).some(o => o.value === semester)) return;
    const opt = document.createElement('option');
    opt.value = semester;
    opt.textContent = semester;
    select.insertBefore(opt, select.querySelector('option[value="custom"]'));
  }

  // 내가 수업을 넣어둔 학기들을 서버에서 받아 드롭다운에 합친다.
  // localStorage가 아니라 서버(= 실제 저장된 수업)를 기준으로 하기 때문에, 직접 입력한 학기도
  // 다른 기기에서 그대로 보이고, 그 학기 수업을 전부 지우면 목록에서도 자연스럽게 빠진다.
  function loadSemesterOptions() {
    return fetch('/api/timetable/courses/semesters')
      .then(res => (res.ok ? res.json() : []))
      .then(list => {
        (Array.isArray(list) ? list : []).forEach(addSemesterOption);
        syncSemesterSelectToInput();
      })
      .catch(() => {});
  }

  function onSemesterSelectChange() {
    const select = document.getElementById('semesterSelect');
    const input = document.getElementById('semesterInput');
    if (select.value === 'custom') {
      input.focus();
      input.select();
    } else {
      input.value = select.value;
      localStorage.setItem('unifeed_timetable_semester', select.value);
      loadCoursesFromServer(); // 학기가 바뀌었으니 그 학기 시간표로 다시 불러온다
    }
  }

  function onSemesterCustomInput() {
    const input = document.getElementById('semesterInput');
    localStorage.setItem('unifeed_timetable_semester', input.value.trim());
    document.getElementById('semesterSelect').value = 'custom';
  }

  // 학기명을 직접 입력하고 다른 곳을 클릭(blur)했을 때만 다시 불러온다 — oninput처럼 글자 하나
  // 칠 때마다 fetch하면 타이핑 중에 서버를 계속 두드리게 된다.
  function onSemesterInputBlur() {
    loadCoursesFromServer();
  }

  /* ==========================================================================
     2. 학점 계산기 로직 (GPA Calculator) - 더미데이터 없음
     ========================================================================== */
  const gradePoints45 = {
    'A+': 4.5, 'A0': 4.0,
    'B+': 3.5, 'B0': 3.0,
    'C+': 2.5, 'C0': 2.0,
    'D+': 1.5, 'D0': 1.0,
    'F': 0.0, 'P': null, 'NP': null
  };

  const gradePoints43 = {
    'A+': 4.3, 'A0': 4.0, 'A-': 3.7,
    'B+': 3.3, 'B0': 3.0, 'B-': 2.7,
    'C+': 2.3, 'C0': 2.0, 'C-': 1.7,
    'D+': 1.3, 'D0': 1.0, 'D-': 0.7,
    'F': 0.0, 'P': null, 'NP': null
  };

  // ⚠️ 더미데이터 없이 빈 상태로 시작!
  let gpaRows = [];

  function renderGpaTable() {
    const tbody = document.getElementById('gpaTableBody');
    tbody.innerHTML = '';

    if (gpaRows.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align: center; color: #94A3B8; padding: 28px 0; font-size: 13px;">
            등록된 과목이 없습니다. <b>[+ 과목 추가하기]</b> 버튼을 누르거나 <b>[시간표 과목 불러오기]</b>를 클릭하세요.
          </td>
        </tr>
      `;
      calculateGPA();
      return;
    }

    gpaRows.forEach((row, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <input type="text" class="gpa-input" value="${escapeHtml(row.name)}" placeholder="과목명 입력" oninput="updateGpaRow(${idx}, 'name', this.value)">
        </td>
        <td>
          <select class="gpa-select" onchange="updateGpaRow(${idx}, 'credit', parseInt(this.value, 10))">
            <option value="1" ${row.credit === 1 ? 'selected' : ''}>1 학점</option>
            <option value="2" ${row.credit === 2 ? 'selected' : ''}>2 학점</option>
            <option value="3" ${row.credit === 3 ? 'selected' : ''}>3 학점</option>
            <option value="4" ${row.credit === 4 ? 'selected' : ''}>4 학점</option>
          </select>
        </td>
        <td>
          <select class="gpa-select" onchange="updateGpaRow(${idx}, 'grade', this.value)">
            <option value="A+" ${row.grade === 'A+' ? 'selected' : ''}>A+ (4.5)</option>
            <option value="A0" ${row.grade === 'A0' ? 'selected' : ''}>A0 (4.0)</option>
            <option value="B+" ${row.grade === 'B+' ? 'selected' : ''}>B+ (3.5)</option>
            <option value="B0" ${row.grade === 'B0' ? 'selected' : ''}>B0 (3.0)</option>
            <option value="C+" ${row.grade === 'C+' ? 'selected' : ''}>C+ (2.5)</option>
            <option value="C0" ${row.grade === 'C0' ? 'selected' : ''}>C0 (2.0)</option>
            <option value="D+" ${row.grade === 'D+' ? 'selected' : ''}>D+ (1.5)</option>
            <option value="D0" ${row.grade === 'D0' ? 'selected' : ''}>D0 (1.0)</option>
            <option value="F"  ${row.grade === 'F' ? 'selected' : ''}>F (0.0)</option>
            <option value="P"  ${row.grade === 'P' ? 'selected' : ''}>Pass (P)</option>
            <option value="NP" ${row.grade === 'NP' ? 'selected' : ''}>Non-Pass (NP)</option>
          </select>
        </td>
        <td>
          <label class="gpa-checkbox-wrap">
            <input type="checkbox" class="gpa-checkbox" ${row.isMajor ? 'checked' : ''} onchange="updateGpaRow(${idx}, 'isMajor', this.checked)">
            <span>전공</span>
          </label>
        </td>
        <td style="text-align: center;">
          <button type="button" class="btn-remove-row" onclick="removeGpaRow(${idx})" title="과목 삭제"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    calculateGPA();
  }

  function addGpaRow() {
    gpaRows.push({ name: '', credit: 3, grade: 'A+', isMajor: true });
    renderGpaTable();
  }

  function removeGpaRow(idx) {
    gpaRows.splice(idx, 1);
    renderGpaTable();
  }

  function updateGpaRow(idx, field, val) {
    gpaRows[idx][field] = val;
    calculateGPA();
  }

  function resetGpaRows() {
    if (confirm('학점 계산기 목록을 모두 비우시겠습니까?')) {
      gpaRows = [];
      localStorage.removeItem('unifeed_gpa_rows');
      renderGpaTable();
    }
  }

  // 시간표에 등록된 수업들을 원클릭으로 성적 테이블에 동기화
  function syncFromTimetable() {
    if (!courses || courses.length === 0) {
      showToast('시간표에 등록된 수업이 없습니다. 먼저 시간표에 수업을 추가해 주세요!', 'error');
      return;
    }
    gpaRows = courses.map(c => {
      const durationHours = (c.endHour + c.endMin/60) - (c.startHour + c.startMin/60);
      const credit = Math.max(1, Math.min(4, Math.round(durationHours)));
      return {
        name: c.name,
        credit: credit,
        grade: 'A+',
        isMajor: true
      };
    });
    renderGpaTable();
    showToast(`시간표에서 ${courses.length}개 과목을 불러왔습니다!`, 'success');
  }

  function calculateGPA() {
    const scale = document.getElementById('gpaScale').value;
    const pointTable = scale === '4.5' ? gradePoints45 : gradePoints43;
    document.getElementById('statScaleLabel').textContent = '/ ' + scale;

    let totalEarnedCredits = 0;
    let totalGpaCredits = 0;
    let totalScore = 0;

    let majorEarnedCredits = 0;
    let majorGpaCredits = 0;
    let majorScore = 0;

    gpaRows.forEach(r => {
      const cr = r.credit;
      const gr = r.grade;
      const pt = pointTable[gr];

      if (gr !== 'F' && gr !== 'NP') {
        totalEarnedCredits += cr;
        if (r.isMajor) {
          majorEarnedCredits += cr;
        }
      }

      if (pt !== null && pt !== undefined) {
        totalGpaCredits += cr;
        totalScore += (pt * cr);

        if (r.isMajor) {
          majorGpaCredits += cr;
          majorScore += (pt * cr);
        }
      }
    });

    const totalGpa = totalGpaCredits > 0 ? (totalScore / totalGpaCredits).toFixed(2) : '0.00';
    const majorGpa = majorGpaCredits > 0 ? (majorScore / majorGpaCredits).toFixed(2) : '0.00';

    document.getElementById('statTotalGpa').textContent = totalGpa;
    document.getElementById('statMajorGpa').textContent = majorGpa;
    document.getElementById('statTotalCredits').textContent = totalEarnedCredits;
    document.getElementById('statMajorCredits').textContent = majorEarnedCredits;
  }

  function saveGpaData() {
    localStorage.setItem('unifeed_gpa_rows', JSON.stringify(gpaRows));
    showToast('학점 계산기 데이터가 저장되었습니다!', 'success');
  }

  function loadStoredGpaData() {
    const saved = localStorage.getItem('unifeed_gpa_rows');
    if (saved) {
      try {
        gpaRows = JSON.parse(saved);
      } catch (e) {
        gpaRows = [];
      }
    } else {
      gpaRows = []; // 더미데이터 없음
    }
    renderGpaTable();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('addCourseModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddModal();
  });

  window.addEventListener('DOMContentLoaded', () => {
    loadSemester();          // 마지막에 보던 학기 복원 (입력칸)
    loadSemesterOptions();   // 내가 수업을 넣어둔 학기들을 드롭다운에 합치기
    initTimetableGrid();
    loadStoredGpaData();
  });
</script>

</body>

<!DOCTYPE html>
<!--
  ############################################################################
  유니피드 공통 프래그먼트 (fragments/layout.html)
  - head(title): Pretendard 웹폰트 CDN + list.css 공통 로드
  - gnb(activeTab): 지도 탭 규격과 100% 완벽히 일치하는 표준 GNB 헤더
    * activeTab 값: 'map' | 'posts' | 'timetable' | 'mypage' | 'adminReports' | 'adminMembers'
  ############################################################################
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- 공통 Head 조각 -->
<th:block th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 다크모드 — CSS 로드/렌더링 전에 최대한 빨리 적용해서 라이트→다크 깜빡임(FOUC) 방지 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('unifeed-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <title th:text="${title}">유니피드</title>
  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- PWA — 홈 화면에 추가해서 설치할 수 있게 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F97316">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="유니피드">
  <!-- 카카오톡/문자 등 링크 공유 시 미리보기 카드 (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:title" th:content="${title}">
  <meta property="og:description" content="전국 대학교 재학생 전용 캠퍼스 미식 &amp; 커뮤니티 플랫폼, 유니피드">
  <meta property="og:image" content="/images/UNIFEED_LOGO.png">
  <!-- Pretendard 폰트 CDN (지도 탭과 동일) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- 디자인 토큰 (색상/radius 변수) — 다른 css보다 먼저 로드 -->
  <link rel="stylesheet" th:href="@{/css/tokens.css(v='6')}">
  <!-- 공통 GNB 및 기본 UI 스타일 -->
  <link rel="stylesheet" th:href="@{/css/list.css(v='17')}">
  <!-- 공통 UI 유틸리티: 토스트 알림 / 버튼 로딩 스피너 -->
  <link rel="stylesheet" th:href="@{/css/ui-common.css(v='5')}">
  <script th:src="@{/js/ui-common.js(v='5')}" defer></script>
</th:block>

<body>

<!-- 유니피드 공식 공통 GNB 헤더 (지도 탭 규격 100% 통일) -->
<header th:fragment="gnb(activeTab)" class="gnb">
  <!-- 맨 왼쪽: 로고 + "유니피드" -->
  <a th:href="@{/}" class="gnb-logo">
    <img th:src="@{/images/UNIFEED_LOGO.png}" alt="유니피드" class="gnb-logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <span class="gnb-logo-fallback">🍊</span>
    <span class="gnb-logo-text">유니피드</span>
  </a>

  <!-- 가운데: 네비게이션 메뉴 (글자크기, 간격, 아이콘 규격 완전 일치) -->
  <nav class="gnb-nav">
    <a th:href="@{/map}" class="gnb-nav-link" th:classappend="${activeTab == 'map' ? 'active' : ''}">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
        <line x1="9" y1="3" x2="9" y2="18"/>
        <line x1="15" y1="6" x2="15" y2="21"/>
      </svg>
      <span>지도</span>
    </a>
    <a th:href="@{/posts}" class="gnb-nav-link" th:classappend="${activeTab == 'posts' || activeTab == 'community' ? 'active' : ''}">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>커뮤니티</span>
    </a>
    <a th:href="@{/timetable}" class="gnb-nav-link" th:classappend="${activeTab == 'timetable' ? 'active' : ''}">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>시간표</span>
    </a>
    <a th:href="@{/mypage}" class="gnb-nav-link" th:classappend="${activeTab == 'mypage' ? 'active' : ''}">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>마이페이지</span>
    </a>
    <!-- 관리자 전용 탭 (일반 계정에는 렌더링되지 않음) -->
    <a th:if="${session.loginMember != null and session.loginMember.admin}" th:href="@{/admin/reports}" class="gnb-nav-link" th:classappend="${activeTab == 'adminReports' ? 'active' : ''}">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>신고 관리</span>
      <span th:if="${pendingReportCount > 0}" class="gnb-notify-badge" th:text="${pendingReportCount > 99 ? '99+' : pendingReportCount}">0</span>
    </a>
    <a th:if="${session.loginMember != null and session.loginMember.admin}" th:href="@{/admin/members}" class="gnb-nav-link" th:classappend="${activeTab == 'adminMembers' ? 'active' : ''}">
      <svg class="nav-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>회원 관리</span>
    </a>
  </nav>

  <!-- 우측: 사용자 정보 및 로그인/로그아웃 -->
  <div class="gnb-right">
    <button type="button" class="gnb-theme-toggle" onclick="toggleTheme()" aria-label="다크모드 전환" title="다크모드 전환">
      <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div th:if="${session.loginMember != null}" class="gnb-notify-wrap">
      <button type="button" class="gnb-notify-btn" onclick="toggleNotifyDropdown()" aria-label="알림" title="알림">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="gnbNotifyBadge" class="gnb-notify-badge" style="display:none;">0</span>
      </button>
      <div id="gnbNotifyDropdown" class="gnb-notify-dropdown" style="display:none;">
        <div class="gnb-notify-header">
          <span>알림</span>
          <button type="button" class="gnb-notify-readall" onclick="markAllNotificationsRead()">모두 읽음</button>
        </div>
        <div id="gnbNotifyList" class="gnb-notify-list">
          <p class="gnb-notify-empty">알림이 없습니다.</p>
        </div>
      </div>
    </div>
    <div th:if="${session.loginMember != null}" class="gnb-user">
      <img th:if="${session.loginMember.profileImage != null and !session.loginMember.profileImage.isBlank()}"
           th:src="${session.loginMember.profileImage}" alt="프로필" class="gnb-avatar">
      <div th:unless="${session.loginMember.profileImage != null and !session.loginMember.profileImage.isBlank()}"
           class="gnb-avatar-default"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <span class="gnb-username" th:text="${session.loginMember.name}">홍길동</span>
      <form th:action="@{/logout}" method="post" class="delete-form"><input type="hidden" name="_csrf" th:value="${csrfToken}">
        <button type="submit" class="gnb-logout-btn">로그아웃</button>
      </form>
    </div>
    <a th:unless="${session.loginMember != null}" th:href="@{/login}" class="gnb-login-link">로그인</a>
  </div>
</header>

</body>
</html>

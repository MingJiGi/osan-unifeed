<!DOCTYPE html>
<!-- 
  =============================================================================
  UNIFEED (유니피드) 공통 레이아웃 Fragment
  =============================================================================
  Spring Boot + Thymeleaf 초보자를 위한 안내:
  이 파일은 직접 웹 브라우저에 표시되는 페이지가 아닙니다.
  다른 HTML 파일들(예: feed, map, timetable, mypage 등)에서 공통적으로 사용하는 
  머리글(Head), 상단바(Header), 하단바(Tab bar) 등의 '조각(Fragment)'을 모아둔 템플릿입니다.
  =============================================================================
-->
<html xmlns:th="http://www.thymeleaf.org">

<!-- 
  1. HEAD Fragment (문서의 머리글 설정)
  매개변수 'title'을 받아서 각 페이지마다 다른 <title>을 설정할 수 있게 합니다.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title th:text="${title} + ' | UNIFEED'">UNIFEED</title>
    
    <!-- Pretendard 폰트 (가독성이 뛰어난 한글 웹 폰트) 불러오기 -->
    <!-- 통합 공통 CSS (app.css) 연결하기 -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    
    <!-- 카카오맵 Javascript SDK (공식 표준: head 안에 로드) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=REDACTED-SET-VIA-ENV&libraries=services,clusterer"></script>
    
    <!-- 공통 자바스크립트 연결하기 -->
    <script th:src="@{/js/common.js}" defer></script>
</head>

<body>

<!-- 
  2. HEADER Fragment (상단바)
  앱의 맨 위에 고정되는 영역입니다. 데스크톱에서는 GNB가 표시되고, 모바일에서는 심플한 로고가 보입니다.
-->
<header th:fragment="header(activeTab)" class="header">
    <div class="header-inner">
        <!-- 로고 영역: 클릭하면 메인(홈) 피드로 이동합니다. -->
        <a th:href="@{/feed}" class="header-logo">UNIFEED</a>
        
        <!-- 데스크톱용 중앙 GNB 네비게이션 -->
        <nav class="desktop-nav">
            <a th:href="@{/map}" class="desktop-nav-link" th:classappend="${activeTab == 'map' || activeTab == '지도'} ? 'active' : ''">🗺️ 지도</a>
            <a th:href="@{/feed}" class="desktop-nav-link" th:classappend="${activeTab == 'feed' || activeTab == '커뮤니티'} ? 'active' : ''">💬 커뮤니티</a>
            <a th:href="@{/timetable}" class="desktop-nav-link" th:classappend="${activeTab == 'timetable' || activeTab == '시간표'} ? 'active' : ''">📅 시간표</a>
            <a th:href="@{/mypage}" class="desktop-nav-link" th:classappend="${activeTab == 'mypage' || activeTab == '마이'} ? 'active' : ''">👤 마이페이지</a>
        </nav>
        
        <!-- 우측 아이콘 영역 (검색, 알림 등) -->
        <div class="header-actions">
            <!-- 검색 아이콘 버튼 -->
            <button type="button" class="header-icon" aria-label="검색">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <!-- 알림 아이콘 버튼 -->
            <button type="button" class="header-icon" aria-label="알림">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </button>
            
            <a th:href="@{/settings}" class="btn btn-outline desktop-only" style="padding: 6px 12px; font-size: 0.85rem; width: auto; height: 36px;">설정</a>
            <a th:href="@{/auth/login}" class="btn btn-primary desktop-only" style="padding: 6px 12px; font-size: 0.85rem; width: auto; height: 36px;">로그아웃</a>
        </div>
    </div>
</header>

<!-- 로그인/회원가입 페이지용 심플 중앙정렬 헤더 -->
<header th:fragment="header-auth" class="header header-auth">
    <div class="header-inner" style="justify-content: center;">
        <a th:href="@{/feed}" class="header-logo">UNIFEED</a>
    </div>
</header>

<!-- 
  3. TAB BAR Fragment (하단 네비게이션 탭 바)
  모바일 화면 하단에 고정되어 4가지 주요 메뉴로 이동하는 영역입니다.
-->
<nav th:fragment="tabbar(activeTab)" class="tab-bar">
    <!-- [1] 지도 탭 -->
    <a th:href="@{/map}" class="tab-item" th:classappend="${activeTab == 'map' || activeTab == '지도'} ? 'active' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
            <line x1="9" y1="3" x2="9" y2="18"></line>
            <line x1="15" y1="6" x2="15" y2="21"></line>
        </svg>
        <span>지도</span>
    </a>
    
    <!-- [2] 커뮤니티(피드) 탭 -->
    <a th:href="@{/feed}" class="tab-item" th:classappend="${activeTab == 'feed' || activeTab == '커뮤니티'} ? 'active' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>커뮤니티</span>
    </a>
    
    <!-- [3] 시간표 탭 -->
    <a th:href="@{/timetable}" class="tab-item" th:classappend="${activeTab == 'timetable' || activeTab == '시간표'} ? 'active' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>시간표</span>
    </a>
    
    <!-- [4] 마이페이지 탭 -->
    <a th:href="@{/mypage}" class="tab-item" th:classappend="${activeTab == 'mypage' || activeTab == '마이'} ? 'active' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>마이</span>
    </a>
</nav>

<!-- 
  4. FAB Fragment (플로팅 글쓰기 버튼)
-->
<a th:fragment="fab" th:href="@{/feed}" class="fab" aria-label="글쓰기">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
</a>

</body>
</html>

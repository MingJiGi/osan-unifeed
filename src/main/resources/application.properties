# ############################################################################
# 애플리케이션 설정
# ----------------------------------------------------------------------------
# 이 예제는 docker 를 쓰지 않는다. 회사 공유 MySQL(toydb)의 `spring-thymeleaf-crud`
# 데이터베이스에 바로 붙는다. (DB 이름을 폴더 이름과 똑같이 두어 다른 예제와 분리)
#
# 여기 값은 "기본값" 이고, 환경변수로 덮어쓸 수 있다(relaxed binding):
#   spring.datasource.url  ->  SPRING_DATASOURCE_URL
# ############################################################################

spring.application.name=osan-unifeed

# ============================================================================
# 요청/응답 문자 인코딩 — 한글 폼 데이터(application/x-www-form-urlencoded) 깨짐 방지
# ============================================================================
# force=true 가 없으면 클라이언트가 Content-Type에 charset을 명시하지 않은 폼 POST의 경우
# Tomcat이 UTF-8을 일관되게 적용하지 않아, 한글 등 멀티바이트 문자가 섞인 폼 제출 시
# "MalformedInputException"으로 400 에러가 남(게시글 작성 등에서 실제로 재현됨).
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# ============================================================================
# DataSource — DB 접속 정보 (회사 공유 MySQL: toydb)
# ============================================================================
# 이 프로젝트는 공유 toydb DB(`toydb`)를 그대로 쓰고, 테이블에 osan_ 프리픽스를 붙여
# 다른 프로젝트와 분리한다(toy 계정이 toydb 에 권한을 갖고 있어 별도 DB 생성이 필요 없다).
#
# ⚠️ 접속 제약:
#   - 이 DB 는 한국 IP 에서만 붙는다(방화벽 geo 제한). 해외에서는 timeout.
#   - 공유 서버라 여러 명이 동시에 붙으면 같은 테이블을 함께 쓴다.
spring.datasource.url=jdbc:mysql://localhost:3306/toydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=toy
spring.datasource.password=REDACTED-SET-VIA-ENV
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.continue-on-error=true

# 커넥션 풀 (HikariCP) — 자세한 설명은 spring-data-jpas 참고
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000


# ============================================================================
# JPA / Hibernate — 저장 기술 (이 예제의 주제는 아님)
# ============================================================================
# 이 예제의 주인공은 Thymeleaf(화면)다. DB 저장은 JPA 로 간단히 처리한다.
#
# ddl-auto=none : Hibernate 가 테이블을 절대 건드리지 않는다(생성/변경 안 함).
#   실무에서 권장하는 방식이다. 스키마는 사람이 관리한다.
#   대신 아래 schema.sql 로 테이블을 만든다(spring.sql.init).
# ⛔ 운영에서 create/update 를 쓰면 안 되는 이유는 spring-data-jpas 참고.
spring.jpa.hibernate.ddl-auto=none

# ----------------------------------------------------------------------------
# SQL 스크립트 초기화 — schema.sql 로 테이블 생성
# ----------------------------------------------------------------------------
# ddl-auto=none 이라 Hibernate 가 테이블을 안 만든다. 그래서 classpath 의
# schema.sql(CREATE TABLE IF NOT EXISTS)을 앱 기동 때 실행해 테이블을 준비한다.
#   always = 임베디드가 아닌 DB(MySQL)에서도 스크립트를 실행한다(기본은 embedded 만).
spring.sql.init.mode=always

# 실행되는 SQL 을 눈으로 보기 위한 설정. 운영에서는 끈다.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 지연로딩(작성자·학교 등)을 행마다 SELECT 하지 않고 최대 100개씩 IN(...) 한 번으로 묶어 읽는다(N+1 완화).
# DB가 원격이라 쿼리 1번 = 네트워크 왕복 1번이라 효과가 크다.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# open-in-view 는 끈다(커넥션 조기 반납). 이유는 spring-data-jpas 참고.
spring.jpa.open-in-view=false


# ============================================================================
# Thymeleaf — 이 예제의 주인공
# ============================================================================
# 템플릿 위치·확장자는 기본값을 그대로 쓴다:
#   classpath:/templates/  + .html
#   즉 컨트롤러가 "memos/list" 를 반환하면 templates/memos/list.html 을 렌더링한다.

# 개발 중에는 템플릿 캐시를 꺼둔다. 그래야 .html 을 고치고 새로고침하면 바로 반영된다.
# [운영 주의] 운영에서는 true 로 둔다. 매 요청마다 템플릿을 다시 파싱하면 느리기 때문이다.
spring.thymeleaf.cache=false

# ============================================================================
# 카카오 지도 API 설정
# ============================================================================
kakao.maps.appkey=REDACTED-SET-VIA-ENV

# ============================================================================
# 이미지 업로드 — 게시글/리뷰 사진
# ============================================================================
# 업로드된 파일이 저장되는 폴더(프로젝트 루트 기준 상대경로). /uploads/** 로 서빙된다.
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================================
# 이메일 인증 — 가입 시 대학교 웹메일로 인증 링크 발송 (Gmail SMTP + 앱 비밀번호)
# ============================================================================
# 발신 계정 정보. 일반 로그인 비밀번호가 아니라 "앱 비밀번호"(16자리)를 써야 한다.
# 비밀번호를 여기 직접 적지 않는다 — git에 커밋되는 파일이라 실제 계정 정보를 넣으면 그대로 노출된다.
# 실행 전에 환경변수 MAIL_USERNAME / MAIL_PASSWORD 를 설정해야 한다(IntelliJ 실행 설정 참고).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 인증 메일 안의 링크가 가리킬 서버 주소. 배포 시 실제 도메인으로 바꿔야 한다.
app.base-url=http://localhost:8080


# ----------------------------------------------------------------------------
# AI 맛집 추천 (Google Gemini) — "오늘 뭐 먹지?" 자유 입력 -> 우리 학교 맛집 중 추천
# ----------------------------------------------------------------------------
# 키는 소스에 적지 않고 환경변수로 받는다(코드가 여러 사람에게 공유되므로).
#   IntelliJ: Run/Debug Configurations -> Environment variables 에 GEMINI_API_KEY 추가
#   서버(VM): /etc/unifeed/unifeed.env 에 GEMINI_API_KEY=... 추가
# 비어 있으면 AI 추천 기능만 조용히 꺼지고 나머지 기능은 그대로 동작한다.
gemini.api-key=${GEMINI_API_KEY:}
# [모델 선택 주의] 무료 등급은 모델마다 하루 호출 한도가 완전히 다르다.
#   gemini-3.8-flash  : 하루 20회 (실측) — 추천 몇 번 눌러보면 끝난다. 쓸 수 없음.
#   gemini-3.1-flash-lite : 한도가 훨씬 넉넉하고, 이 앱이 쓰는 작업(추천/태그/시간표 OCR)에서
#                           품질 차이가 없었다. 속도도 3배 빠름(3초 vs 10초).
# 유료 결제를 붙이면 그때 더 큰 모델로 바꿔도 된다.
gemini.model=gemini-3.1-flash-lite

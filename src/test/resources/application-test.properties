# ############################################################################
# 테스트 전용 설정 — H2 인메모리 (도커·네트워크·비번 불필요)
# ----------------------------------------------------------------------------
# 테스트는 실제 MySQL 에 붙지 않는다. 어디서든 즉시 도는 H2 인메모리로 돌린다.
# MODE=MySQL 로 MySQL 문법을 최대한 흉내내게 한다.
# ############################################################################
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 테스트마다 스키마를 새로 만들고 끝나면 지운다.
# (운영 설정은 ddl-auto=none + schema.sql 이지만, 테스트는 H2 라 Hibernate 로 스키마를 만든다)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# schema.sql 은 MySQL 전용 문법이라 H2 테스트에서는 실행하지 않는다.
spring.sql.init.mode=never

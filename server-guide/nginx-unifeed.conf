# unifeed — nginx 리버스 프록시 (서버의 80 포트 → 우리 앱 8080)
#
# 설치:
#   sudo cp server-guide/nginx-unifeed.conf /etc/nginx/sites-available/unifeed
#   sudo ln -sf /etc/nginx/sites-available/unifeed /etc/nginx/sites-enabled/unifeed
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 는 앞단 LB 가 처리하고 여기로는 80(HTTP)으로 들어온다.
# 그래서 여기에는 443·인증서 설정이 없다 (넣지 않는다).

upstream unifeed_app {
    server 127.0.0.1:8080;      # Spring Boot 기본 포트. 앱 포트를 바꾸면 여기도 바꾼다
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com _;

    location / {
        proxy_pass http://unifeed_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;               # 실제 사용자 IP (LB 정보로 이미 복원됨)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;                     # 사용자는 LB 에 https 로 들어왔다
        proxy_set_header X-Forwarded-Port  443;

        # WebSocket 을 쓰는 경우에도 그대로 동작하게
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
    }
}

# WebSocket 이면 upgrade, 아니면 keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── 정적 사이트 예시 (React/Vue 빌드 파일만 올리는 경우) ─────────────────────────
# 위 server 블록 대신 아래를 쓴다. 빌드 결과물은 /var/www/unifeed 에 둔다.
